<style>
/* ============ WE VISUAL IDENTITY ============ */
:root{
  --we-purple:#5B2C94;      /* extracted from uploaded WE logo */
  --we-purple-d:#3B1A63;
  --we-purple-dd:#2A1147;
  --we-magenta:#E6007E;
  --we-orange:#F58220;
  --we-violet:#8B4FD6;

  --shift-S:#F58220;  --shift-S-bg:#FFF3E6;  --shift-S-bd:#F9C48A;  --shift-S-glow:rgba(245,130,32,.35);
  --shift-L:#5B2C94;  --shift-L-bg:#F0E9FA;  --shift-L-bd:#B99BE0;  --shift-L-glow:rgba(91,44,148,.35);
  --shift-C:#E6007E;  --shift-C-bg:#FDEAF4;  --shift-C-bd:#F49CC8;  --shift-C-glow:rgba(230,0,126,.32);
  --shift-W:#4F46E5;  --shift-W-bg:#EEEDFC;  --shift-W-bd:#B0ABF2;  --shift-W-glow:rgba(79,70,229,.30);
  --shift-R:#64748B;  --shift-R-bg:#F1F3F6;  --shift-R-bd:#C3CBD6;  --shift-R-glow:rgba(100,116,139,.28);
  --shift-D:#047857;  --shift-D-bg:#E4F4EE;  --shift-D-bd:#96D2BC;  --shift-D-glow:rgba(4,120,87,.28);
  --shift-E:#0891B2;  --shift-E-bg:#E2F4F9;  --shift-E-bd:#93D3E5;  --shift-E-glow:rgba(8,145,178,.28);

  --bg:#F4F2F8; --surface:#FFFFFF; --surface-2:#FAF9FC;
  --line:#E4DFEC; --line-2:#EFEBF5;
  --ink:#1B1330; --ink-2:#5A5170; --ink-3:#8A82A0;
  --ok:#12A150; --warn:#D97706; --err:#DC2626;

  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:24px;
  --sh-s:0 1px 2px rgba(27,19,48,.06), 0 1px 3px rgba(27,19,48,.05);
  --sh-m:0 4px 14px rgba(43,20,80,.09), 0 1px 3px rgba(43,20,80,.06);
  --sh-l:0 18px 50px -12px rgba(43,20,80,.28), 0 6px 18px rgba(43,20,80,.10);
  --sh-glow:0 0 0 4px rgba(91,44,148,.12);
  --grad-brand:linear-gradient(135deg,#3B1A63 0%,#5B2C94 42%,#8B4FD6 72%,#E6007E 100%);
  --grad-head:linear-gradient(112deg,#2A1147 0%,#4A2179 35%,#5B2C94 62%,#7B3AAE 85%,#A8309C 100%);
  --cell-w:40px; --cell-h:34px; --name-w:190px; --fs-cell:12px; --fs-day:10px;
  --ff:'Cairo',system-ui,sans-serif;
}
html[data-theme="dark"]{
  --bg:#140D22; --surface:#1D1533; --surface-2:#241A3E;
  --line:#33284F; --line-2:#2A2044;
  --ink:#F2EEFA; --ink-2:#B6ADCF; --ink-3:#8479A6;
  --shift-S-bg:#3A2410; --shift-S-bd:#8A5418;
  --shift-L-bg:#2B1B47; --shift-L-bd:#6B44A8;
  --shift-C-bg:#3D0F27; --shift-C-bd:#992459;
  --shift-W-bg:#1E1B4B; --shift-W-bd:#4338CA; --shift-R-bg:#252B36; --shift-R-bd:#4A5568;
  --shift-D-bg:#062E24; --shift-D-bd:#0F6B4F; --shift-E-bg:#082F3B; --shift-E-bd:#0E6E87;
  --sh-m:0 4px 14px rgba(0,0,0,.4); --sh-l:0 18px 50px -12px rgba(0,0,0,.6);
}
html[dir="ltr"]{--ff:'Inter',system-ui,sans-serif;--name-w:210px;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh}
/* gradient text must never disappear on engines without background-clip:text */
/* Gradient text. The clip MUST live in the same rule as the `background`
   shorthand, otherwise the shorthand resets background-clip to border-box
   and the element paints as a solid gradient bar with invisible text. */
.gtext{-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent}
@supports not ((-webkit-background-clip:text) or (background-clip:text)){
  .gtext{background:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
}
html.no-clip .gtext{background:none!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
html.no-clip .sig .sig-dot{display:none}
body{
  font-family:var(--ff);background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.5;overflow:hidden;
  height:100vh;height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:
    radial-gradient(900px 500px at 88% -8%,rgba(230,0,126,.10),transparent 62%),
    radial-gradient(800px 480px at 6% 4%,rgba(91,44,148,.13),transparent 60%),
    radial-gradient(700px 420px at 50% 108%,rgba(245,130,32,.07),transparent 62%);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{height:11px;width:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--we-violet),var(--we-purple));border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--we-magenta),var(--we-purple))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ HEADER ============ */
.hdr{position:relative;z-index:20;background:var(--grad-head);color:#fff;flex:0 0 auto;
  box-shadow:0 6px 26px -8px rgba(43,17,71,.6);}
.hdr .fib{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55;z-index:0}
.hdr::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
   radial-gradient(circle at 12% 120%,rgba(255,255,255,.14) 0 1.4px,transparent 1.6px),
   radial-gradient(circle at 30% -20%,rgba(255,255,255,.12) 0 1.4px,transparent 1.6px),
   radial-gradient(circle at 68% 130%,rgba(255,255,255,.12) 0 1.4px,transparent 1.6px),
   linear-gradient(115deg,transparent 46%,rgba(255,255,255,.07) 47%,transparent 48%),
   linear-gradient(65deg,transparent 62%,rgba(255,255,255,.05) 63%,transparent 64%);
  background-size:180px 100%,240px 100%,200px 100%,100% 100%,100% 100%;}
.hdr-in{position:relative;z-index:1;display:flex;align-items:center;gap:14px;padding:9px 18px;}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:50%;flex:0 0 auto;
  box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 22px rgba(230,0,126,.55);
  animation:logoIn .8s cubic-bezier(.2,.9,.25,1) both;}
@keyframes logoIn{from{opacity:0;transform:scale(.5) rotate(-25deg)}to{opacity:1;transform:none}}
.ttl{min-width:0}
.ttl h1{font-size:19px;font-weight:800;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(92deg,#fff 30%,#FFD9F0 70%,#FFC28A);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ttl p{font-size:10.5px;color:rgba(255,255,255,.62);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.hdr-sp{flex:1}
.cyc-chip{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.18);
  padding:6px 12px;border-radius:99px;backdrop-filter:blur(12px);transition:.2s;white-space:nowrap}
.cyc-chip:hover{background:rgba(255,255,255,.19);transform:translateY(-1px)}
.cyc-chip b{font-size:12.5px;font-weight:700}
.cyc-chip span{font-size:10.5px;color:rgba(255,255,255,.65)}
.ok-pill{background:rgba(18,161,80,.9);color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px}
.warn-pill{background:rgba(217,119,6,.95);color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:99px}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.17);
  color:#fff;padding:7px 11px;border-radius:10px;font-size:12px;font-weight:600;transition:.18s;backdrop-filter:blur(10px)}
.hbtn:hover{background:rgba(255,255,255,.22);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.22)}
.hbtn svg{width:15px;height:15px}
.credit{display:flex;flex-direction:column;align-items:flex-end;gap:1px;padding:4px 12px;border-radius:11px;
  background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(10px);white-space:nowrap;
  animation:logoIn .9s cubic-bezier(.2,.9,.25,1) both;animation-delay:.15s}
.credit .cl{font-size:8px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.credit .sig{font-size:12.5px}
.credit .sig .sig-dot{bottom:-5px;width:6px;height:2.5px;animation-duration:5.4s}
.credit .sig::after{bottom:-4px}
.credit:hover .cl{color:rgba(255,255,255,.8)}
.credit{transition:.3s}
.credit:hover{background:rgba(0,0,0,.34);border-color:rgba(255,255,255,.3)}
.lang-sw{display:flex;background:rgba(0,0,0,.25);border-radius:99px;padding:3px;border:1px solid rgba(255,255,255,.14)}
.lang-sw button{padding:5px 13px;border-radius:99px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.66);transition:.2s}
.lang-sw button.on{background:#fff;color:var(--we-purple-d);box-shadow:0 2px 8px rgba(0,0,0,.25)}

/* ============ NAV ============ */
.nav{position:relative;z-index:19;display:flex;align-items:center;gap:4px;padding:0 14px;flex:0 0 auto;
  background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--sh-s);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;display:flex;align-items:center;gap:7px;padding:11px 13px;font-size:12.5px;font-weight:600;
  color:var(--ink-3);transition:.18s;white-space:nowrap;border-radius:9px 9px 0 0}
.nav button svg{width:16px;height:16px;opacity:.8}
.nav button:hover{color:var(--we-purple);background:var(--surface-2)}
.nav button.on{color:var(--we-purple)}
html[data-theme="dark"] .nav button.on{color:#C79BFF}
.nav button.on::after{content:'';position:absolute;inset-inline:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;
  background:var(--grad-brand);box-shadow:0 -2px 12px var(--shift-L-glow)}
.nav .badge{background:var(--we-magenta);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:99px;min-width:16px;text-align:center}
/* ============ LAYOUT ============ */
.main{position:relative;z-index:1;flex:1;display:flex;min-height:0;overflow:hidden}
.stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.view{display:none;flex:1;min-height:0;flex-direction:column}
.view.on{display:flex}
.pad{padding:16px;overflow:auto;flex:1}

/* ============ TOOLBAR ============ */
.tools{display:flex;align-items:center;gap:8px;padding:8px 14px;flex:0 0 auto;flex-wrap:wrap;
  background:var(--surface);border-bottom:1px solid var(--line)}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:6.5px 11px;border-radius:9px;font-size:12px;font-weight:600;
  color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);transition:.16s;white-space:nowrap}
.tbtn svg{width:14px;height:14px}
.tbtn:hover{color:var(--we-purple);border-color:var(--we-violet);background:var(--shift-L-bg);transform:translateY(-1px);box-shadow:var(--sh-s)}
.tbtn:disabled{opacity:.38;pointer-events:none}
/* undo / redo are the safety net — they must read as available */
#undoBtn:not(:disabled),#redoBtn:not(:disabled){
  color:var(--we-purple);border-color:var(--we-violet);background:var(--shift-L-bg);font-weight:700}
html[data-theme="dark"] #undoBtn:not(:disabled),html[data-theme="dark"] #redoBtn:not(:disabled){color:#C79BFF}
#undoBtn:not(:disabled):hover,#redoBtn:not(:disabled):hover{
  background:var(--grad-brand);color:#fff;border-color:transparent;box-shadow:0 5px 16px var(--shift-L-glow)}
#undoBtn .ub{display:none;background:var(--we-magenta);color:#fff;font-size:9px;font-weight:800;
  padding:1px 5px;border-radius:99px;min-width:16px;text-align:center}
#undoBtn:not(:disabled) .ub{display:inline-block}
.toast .t-undo{margin-inline-start:auto;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;
  padding:5px 12px;border-radius:9px;border:1.5px solid var(--we-violet);color:var(--we-purple);
  background:var(--shift-L-bg);transition:.15s;white-space:nowrap}
html[data-theme="dark"] .toast .t-undo{color:#C79BFF}
.toast .t-undo:hover{background:var(--grad-brand);color:#fff;border-color:transparent}
.toast{max-width:min(420px,calc(100vw - 40px))}
.tbtn.on{background:var(--grad-brand);color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--shift-L-glow)}
.tbtn.primary{background:var(--grad-brand);color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--shift-L-glow)}
.tbtn.primary:hover{filter:brightness(1.08);color:#fff}
.tbtn.danger:hover{color:var(--err);border-color:var(--err);background:#FEF2F2}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 10px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--ink-3);transition:.16s}
.seg button.on{background:var(--surface);color:var(--we-purple);box-shadow:var(--sh-s)}
.tsep{width:1px;height:22px;background:var(--line);margin:0 2px}
.tsp{flex:1}
.srch{position:relative;display:flex;align-items:center}
.srch svg{position:absolute;inset-inline-start:9px;width:14px;height:14px;color:var(--ink-3);pointer-events:none}
.srch input{padding:7px 11px;padding-inline-start:29px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);
  font-size:12px;width:170px;transition:.2s;outline:none}
.srch input:focus{border-color:var(--we-violet);box-shadow:var(--sh-glow);background:var(--surface);width:210px}
.legend{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--ink-2);font-weight:600}
.lg{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:3px 8px;border-radius:99px;transition:.16s;border:1px solid transparent}
.lg:hover{background:var(--surface-2);border-color:var(--line)}
.lg.off{opacity:.35}
.lg i{width:15px;height:15px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:800;font-style:normal}

/* ============ ROSTER GRID ============ */
.grid-wrap{flex:1;overflow:auto;position:relative;background:var(--surface);scroll-behavior:auto;overscroll-behavior:contain}
.grid-wrap::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:
    linear-gradient(102deg,transparent 49.6%,rgba(139,79,214,.05) 49.8%,transparent 50.1%),
    linear-gradient(78deg,transparent 32.6%,rgba(230,0,126,.035) 32.8%,transparent 33.1%),
    radial-gradient(circle at 18% 82%,rgba(102,245,255,.05) 0 1.4px,transparent 1.8px);
  background-size:340px 100%,480px 100%,220px 220px}
table.roster{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;table-layout:fixed}
table.roster th,table.roster td{padding:0;margin:0}
/* date header */
.roster thead th{position:sticky;top:0;z-index:12;background:var(--surface);height:46px;
  border-bottom:2px solid var(--line);border-inline-end:1px solid var(--line-2);vertical-align:middle}
.roster thead th.nm{inset-inline-start:0;z-index:14;width:var(--name-w);min-width:var(--name-w);max-width:var(--name-w);
  border-inline-end:2px solid var(--line);background:var(--surface)}
.roster thead th.tot{inset-inline-end:0;z-index:14;width:158px;min-width:158px;border-inline-start:2px solid var(--line)}
.dh{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:100%;padding:2px;position:relative;transition:.2s}
.dh .dw{font-size:calc(var(--fs-day) - .5px);color:var(--ink-3);font-weight:600;line-height:1.1;white-space:nowrap}
.dh .dd{font-size:calc(var(--fs-day) + 3px);font-weight:800;color:var(--ink);line-height:1.1}
.dh .dm{font-size:calc(var(--fs-day) - 1.5px);color:var(--ink-3);font-weight:600;line-height:1.1;text-transform:uppercase;letter-spacing:.3px}
th.we .dh{background:linear-gradient(180deg,rgba(91,44,148,.26),rgba(91,44,148,.09));border-radius:9px 9px 0 0}
th.we .dh .dw{color:var(--we-purple);font-weight:800}
th.we .dh .dd{color:var(--we-purple)}
th.we .dh .dm{color:var(--we-purple);opacity:.85}
html[data-theme="dark"] th.we .dh{background:linear-gradient(180deg,rgba(139,79,214,.40),rgba(139,79,214,.14))}
html[data-theme="dark"] th.we .dh .dw,html[data-theme="dark"] th.we .dh .dd,html[data-theme="dark"] th.we .dh .dm{color:#C79BFF}
th.today{z-index:13!important}
th.today .dh{background:var(--grad-brand);color:#fff;border-radius:9px 9px 0 0;box-shadow:0 4px 18px var(--shift-L-glow)}
th.today .dh .dw,th.today .dh .dd,th.today .dh .dm{color:#fff}
th.today .dh::after{content:'';position:absolute;bottom:-2px;inset-inline:0;height:3px;
  background:linear-gradient(90deg,#66F5FF,#E6007E,#FFC28A);
  box-shadow:0 0 10px rgba(230,0,126,.75)}
/* ===== holiday / Eid columns — the whole day is tinted ===== */
th.hol .dh{position:relative;border-radius:9px 9px 0 0}
th.hol .dh::before{content:'';position:absolute;top:0;inset-inline:3px;height:3px;border-radius:0 0 3px 3px}
th.hol .hol-tag{position:absolute;top:3px;inset-inline-end:3px;font-size:8px;font-weight:800;line-height:1;
  padding:1px 4px;border-radius:5px;color:#fff}
th.hol-R .dh{background:linear-gradient(180deg,rgba(100,116,139,.46),rgba(100,116,139,.18))}
th.hol-D .dh{background:linear-gradient(180deg,rgba(4,120,87,.42),rgba(4,120,87,.16))}
th.hol-E .dh{background:linear-gradient(180deg,rgba(8,145,178,.42),rgba(8,145,178,.16))}
th.hol-R .dh::before,th.hol-R .hol-tag{background:var(--shift-R)}
th.hol-D .dh::before,th.hol-D .hol-tag{background:var(--shift-D)}
th.hol-E .dh::before,th.hol-E .hol-tag{background:var(--shift-E)}
th.hol-R .dh .dw,th.hol-R .dh .dd,th.hol-R .dh .dm{color:var(--shift-R)}
th.hol-D .dh .dw,th.hol-D .dh .dd,th.hol-D .dh .dm{color:var(--shift-D)}
th.hol-E .dh .dw,th.hol-E .dh .dd,th.hol-E .dh .dm{color:var(--shift-E)}
html[data-theme="dark"] th.hol-R .dh .dw,html[data-theme="dark"] th.hol-R .dh .dd,html[data-theme="dark"] th.hol-R .dh .dm{color:#CBD5E1}
html[data-theme="dark"] th.hol-D .dh .dw,html[data-theme="dark"] th.hol-D .dh .dd,html[data-theme="dark"] th.hol-D .dh .dm{color:#6EE7B7}
html[data-theme="dark"] th.hol-E .dh .dw,html[data-theme="dark"] th.hol-E .dh .dd,html[data-theme="dark"] th.hol-E .dh .dm{color:#67E8F9}

.toast svg{width:17px;height:17px;flex:0 0 auto}
.toast.out{animation:tOut .25s forwards}
@keyframes tIn{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateY(10px) scale(.95)}}
.stat-lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.slg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:15px;box-shadow:var(--sh-s);
  position:relative;overflow:hidden;transition:.2s}
.slg:hover{transform:translateY(-3px);box-shadow:var(--sh-m)}
.slg::before{content:'';position:absolute;top:0;inset-inline-start:0;width:100%;height:3px;background:var(--grad-brand)}
.slg .v{font-size:29px;font-weight:800;line-height:1}
.slg .l{font-size:11px;color:var(--ink-3);font-weight:700;margin-top:4px}
.slg .ic{position:absolute;top:13px;inset-inline-end:13px;opacity:.13}
.slg .ic svg{width:34px;height:34px}
.mini-list{max-height:100%;overflow:auto}
.ml-row{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line-2);transition:.14s}
.ml-row:hover{background:var(--surface-2)}
.ml-row:last-child{border-bottom:none}
.ml-row .av{width:31px;height:31px;border-radius:10px;background:var(--grad-brand);color:#fff;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;flex:0 0 auto}
.ml-row .info{flex:1;min-width:0}
.ml-row .info b{font-size:12.5px;font-weight:700;display:block}
.ml-row .info span{font-size:10.5px;color:var(--ink-3)}
/* ============ COMPARE / MOBILE / PRINT ============ */
.cmp-pick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.cmp-pick button{font-size:12px;font-weight:700;padding:7px 13px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface-2);color:var(--ink-2);transition:.16s}
.cmp-pick button:hover{border-color:var(--we-violet);transform:translateY(-2px)}
.cmp-pick button.on{background:var(--grad-brand);color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--shift-L-glow)}
.gbars{display:flex;align-items:flex-end;gap:22px;height:220px;padding:14px 10px 0;overflow-x:auto}
.ggrp{display:flex;flex-direction:column;align-items:center;gap:8px;flex:0 0 auto}
.ggrp .bars{display:flex;align-items:flex-end;gap:5px;height:172px}
.ggrp .bar{width:24px;border-radius:7px 7px 0 0;position:relative;transition:height .6s cubic-bezier(.2,.9,.3,1);min-height:3px;
  display:flex;align-items:flex-start;justify-content:center}
.ggrp .bar span{position:absolute;top:-17px;font-size:10px;font-weight:800;color:var(--ink-2)}
.ggrp .bar:hover{filter:brightness(1.14)}
.ggrp .lb{font-size:11px;font-weight:700;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.mob-card{display:none}
@media(max-width:820px){
  .gate-photo{animation:photoIn 1.2s ease both}          /* no ken-burns on phones */
  .gate .scene{opacity:.85}
  .hdr .fib{display:none}
  .grid-wrap::before{display:none}
  body::before{display:none}
  .gate-card{backdrop-filter:blur(18px)}
  .ttl h1{font-size:14px} .ttl p{display:none} .logo{width:34px;height:34px}
  .hdr-in{padding:7px 10px;gap:8px} .hide-sm{display:none!important}
  .side.on{width:100%;position:fixed;inset:0;z-index:250;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .side-in{width:100%}
  .side-x{width:36px;height:36px}
  .modal{max-height:88vh;max-height:88dvh;border-radius:22px}
  .m-bd{padding:14px 16px}
  .m-ft{flex-wrap:wrap}.m-ft .btn{flex:1;min-width:120px}
  .tools{gap:6px;padding:7px 10px}
  .tbtn span{display:none}.tbtn.primary span,.seg button{display:inline}
  .srch input{width:120px}.srch input:focus{width:150px}
  .toast-w{inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
  .toast{min-width:0;width:100%}
  .nav button span{font-size:11px}
  .pop{inset-inline:10px!important;max-width:calc(100vw - 20px)}
  .pop-row{grid-template-columns:repeat(4,1fr)}
  .pop-row button{min-width:0;height:52px}
  .grid-wrap.mobile table.roster{display:none}
  .mob-card{display:block;padding:12px}
  .mc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-bottom:11px;overflow:hidden;box-shadow:var(--sh-s)}
  .mc-h{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .mc-h .av{width:31px;height:31px;border-radius:10px;background:var(--grad-brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
  .mc-h b{flex:1;font-size:13px}
  .mc-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:5px;padding:11px}
  .mcell{border:1px solid var(--line);border-radius:9px;padding:5px 2px;text-align:center;transition:.14s}
  .mcell.wke{background:rgba(91,44,148,.12);border-color:rgba(91,44,148,.30)}
  .mcell .d{font-size:9px;color:var(--ink-3);font-weight:700}
  .mcell .s{font-size:13px;font-weight:800;margin-top:2px;min-height:17px}
  .mcell.S{background:var(--shift-S-bg);border-color:var(--shift-S-bd);color:var(--shift-S)}
  .mcell.L{background:var(--shift-L-bg);border-color:var(--shift-L-bd);color:var(--shift-L)}
  .mcell.C{background:var(--shift-C-bg);border-color:var(--shift-C-bd);color:var(--shift-C)}
  .grid2,.grid3{grid-template-columns:1fr}
  .swapviz{grid-template-columns:1fr;gap:9px} .swaparrow{transform:rotate(90deg)}
}
#fatal{display:none}
#fatal.on{display:flex;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:22px;
  background:linear-gradient(160deg,#2A1147,#4A2179);overflow:auto;
  font-family:'Cairo',system-ui,sans-serif;direction:rtl}
.fatal-box{max-width:520px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
  border-radius:22px;padding:24px;color:#fff;box-shadow:0 30px 70px -20px rgba(0,0,0,.7)}
.fatal-h{font-size:17px;font-weight:800;margin-bottom:12px;color:#FFC7A0}
.fatal-box p{font-size:13px;line-height:1.85;margin-bottom:9px;color:rgba(255,255,255,.88)}
.fatal-box .fatal-en{direction:ltr;text-align:left;font-size:12px;color:rgba(255,255,255,.6)}
.fatal-box code{display:block;margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.35);
  direction:ltr;text-align:left;font-size:10.5px;line-height:1.6;color:#FFB3D2;white-space:pre-wrap;word-break:break-word}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:9mm}
  /* The print sheet is always light — never inherit the dark theme,
     otherwise light text lands on a white page and disappears. */
  html,body{overflow:visible!important;background:#fff!important;display:block!important;
    color:#14102A!important;-webkit-text-fill-color:#14102A!important}
  #printArea,#printArea *{color:#14102A;-webkit-text-fill-color:#14102A;
    text-shadow:none!important;filter:none!important;background-image:none}
  #printArea table.pr th,#printArea table.pr td{color:#14102A!important;-webkit-text-fill-color:#14102A!important}
  body::before,.hdr,.nav,.tools,.side,.ovl,.pop,.toast-w,.main{display:none!important}
  #printArea{display:block!important}
  .pr-hd{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid #5B2C94;padding-bottom:8px;margin-bottom:10px}
  .pr-hd img{width:44px;height:44px}
  #printArea .pr-hd h1{font-size:16pt;color:#3B1A63!important;-webkit-text-fill-color:#3B1A63!important;font-weight:800;
    background:none!important}
  .pr-hd p{font-size:8pt;color:#555!important;-webkit-text-fill-color:#555!important}
  .pr-hd .meta{margin-inline-start:auto;text-align:end;font-size:8.5pt;color:#444;font-weight:600}
  table.pr{width:100%;border-collapse:collapse;font-size:8.5pt;table-layout:fixed}
  table.pr th,table.pr td{border:.6pt solid #9C8FBC;padding:2pt 1pt;text-align:center;overflow:hidden;
    color:#14102A!important;-webkit-text-fill-color:#14102A!important}

    font-weight:800;font-size:7.5pt;line-height:1.25;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  table.pr th.nmp{width:86pt;text-align:start;padding-inline-start:5pt;font-size:8pt}

  #printArea table.pr td.dpt{background:#5B2C94!important;color:#fff!important;-webkit-text-fill-color:#fff!important;
    font-weight:800;text-align:start;padding-inline-start:6pt;font-size:9pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.pr td b{font-size:10pt;font-weight:800;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pr-lg b{font-size:9pt}
  #printArea .pr-lg b.S{color:#A34A00!important;-webkit-text-fill-color:#A34A00!important}
  #printArea .pr-lg b.L{color:#3B1A63!important;-webkit-text-fill-color:#3B1A63!important}
  #printArea .pr-lg b.C{color:#9C0057!important;-webkit-text-fill-color:#9C0057!important}
  #printArea .pr-lg b.W{color:#2E2A9E!important;-webkit-text-fill-color:#2E2A9E!important}
  #printArea .pr-lg b.R{color:#3C4655!important;-webkit-text-fill-color:#3C4655!important}
  #printArea .pr-lg b.D{color:#04533C!important;-webkit-text-fill-color:#04533C!important}
  #printArea .pr-lg b.E{color:#065E76!important;-webkit-text-fill-color:#065E76!important}
  #printArea table.pr td b.S{color:#A34A00!important;-webkit-text-fill-color:#A34A00!important}
  #printArea table.pr td b.L{color:#3B1A63!important;-webkit-text-fill-color:#3B1A63!important}
  #printArea table.pr td b.C{color:#9C0057!important;-webkit-text-fill-color:#9C0057!important}
  #printArea table.pr td b.W{color:#2E2A9E!important;-webkit-text-fill-color:#2E2A9E!important}
  #printArea table.pr td b.R{color:#3C4655!important;-webkit-text-fill-color:#3C4655!important}
  #printArea table.pr td b.D{color:#04533C!important;-webkit-text-fill-color:#04533C!important}
  #printArea table.pr td b.E{color:#065E76!important;-webkit-text-fill-color:#065E76!important}
  table.pr td.wkp,table.pr th.wkp{background:#E6DFF3!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.pr .holp{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.pr td.holp-R,table.pr th.holp-R{background:#D3D9E2!important;box-shadow:inset 1.8pt 0 0 #475569,inset -1.8pt 0 0 #475569}

/* ============ ROLE GATE ============ */
.gate{position:fixed;inset:0;z-index:600;display:none;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;background:#150826;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
.gate.on{display:block}
.gate-wrap{position:relative;z-index:4;min-height:100%;display:flex;align-items:center;justify-content:center}
/* real photograph of the Telecom Egypt Smart Village headquarters */
.gate-photo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center var(--gate-pos,42%);
  z-index:0;pointer-events:none;user-select:none;
  animation:photoIn 1.6s cubic-bezier(.2,.8,.25,1) both, kenburns 42s ease-in-out infinite alternate 1.6s}
@keyframes photoIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1.02)}}
@keyframes kenburns{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.11) translate3d(-1.2%,-1.6%,0)}}
/* WE night grade over the daylight photo — building stays clearly readable */
.gate-tint{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--gate-dark,.70);
  background:
    linear-gradient(180deg,rgba(21,8,38,1) 0%,rgba(34,14,62,.52) 24%,rgba(42,17,71,.29) 46%,rgba(20,8,38,.86) 80%,rgba(10,4,22,1) 100%),
    radial-gradient(1150px 660px at 50% 58%,rgba(91,44,148,.20),transparent 70%),
    radial-gradient(950px 520px at 50% 110%,rgba(230,0,126,.30),transparent 66%),
    linear-gradient(90deg,rgba(10,4,22,.62) 0%,transparent 24%,transparent 76%,rgba(10,4,22,.62) 100%);
  animation:tintIn 1.6s ease both}
@keyframes tintIn{from{opacity:0}to{opacity:1}}
.gate .scene{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;
  animation:sceneIn 1.8s cubic-bezier(.2,.8,.25,1) .5s both}
@keyframes sceneIn{from{opacity:0}to{opacity:1}}
.gate-veil{position:fixed;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(640px 470px at 50% 48%,rgba(10,4,22,.66),rgba(10,4,22,.26) 60%,transparent 100%)}
.gate-caption{position:fixed;bottom:14px;inset-inline-start:0;inset-inline-end:0;z-index:3;text-align:center;
  font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.42);
  pointer-events:none;animation:tintIn 2s ease 1s both}

.gate::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.16;z-index:3;
  background-image:
   radial-gradient(circle at 14% 22%,rgba(255,255,255,.16) 0 1.7px,transparent 2px),
   radial-gradient(circle at 78% 12%,rgba(255,255,255,.13) 0 1.7px,transparent 2px),
   radial-gradient(circle at 38% 84%,rgba(255,255,255,.12) 0 1.7px,transparent 2px),
   radial-gradient(circle at 88% 72%,rgba(255,255,255,.14) 0 1.7px,transparent 2px),
   linear-gradient(118deg,transparent 44%,rgba(255,255,255,.055) 45%,transparent 46%),
   linear-gradient(62deg,transparent 66%,rgba(255,255,255,.045) 67%,transparent 68%),
   linear-gradient(96deg,transparent 24%,rgba(255,255,255,.04) 25%,transparent 26%);
  background-size:220px 220px,260px 260px,240px 240px,280px 280px,100% 100%,100% 100%,100% 100%;
  animation:gdrift 26s linear infinite}
@keyframes gdrift{to{background-position:220px 220px,-260px 260px,240px -240px,-280px -280px,0 0,0 0,0 0}}
.gate::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(900px 420px at 50% 0%,rgba(230,0,126,.16),transparent 62%)}
.gate-card{position:relative;z-index:4;width:100%;max-width:580px;background:rgba(18,8,34,.52);
  border:1px solid rgba(255,255,255,.17);border-radius:30px;backdrop-filter:blur(32px) saturate(1.25);
  box-shadow:0 50px 110px -26px rgba(0,0,0,.85),0 0 0 1px rgba(139,79,214,.22),inset 0 1px 0 rgba(255,255,255,.18);
  overflow:hidden;animation:gIn .62s cubic-bezier(.2,1,.3,1) .25s both;color:#fff;margin:auto}
.gate-card::before{content:'';position:absolute;top:0;inset-inline:0;height:2px;
  background:linear-gradient(90deg,transparent,#66F5FF,#E6007E,#FFC28A,transparent);opacity:.85;
  animation:gscan 4.5s ease-in-out infinite}
@keyframes gscan{0%,100%{transform:translateX(-24%);opacity:.35}50%{transform:translateX(24%);opacity:.95}}
@keyframes gIn{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1;transform:none}}
.gate-hd{padding:26px 26px 18px;text-align:center;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.08),transparent)}
.gate-hd::after{content:'';position:absolute;bottom:0;inset-inline:16%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.gate-logo{width:74px;height:74px;border-radius:50%;
  box-shadow:0 0 0 3px rgba(255,255,255,.92),0 0 46px rgba(230,0,126,.7);
  animation:glogo 1s cubic-bezier(.2,.9,.25,1) both}
@keyframes glogo{from{opacity:0;transform:scale(.4) rotate(-40deg)}to{opacity:1;transform:none}}
.gate-hd h1{font-size:20px;font-weight:800;margin-top:14px;line-height:1.35;
  background:linear-gradient(92deg,#fff 26%,#FFD9F0 62%,#FFC28A);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.gate-hd p{font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.7px;margin-top:5px;font-weight:500}
.gate-lang{display:inline-flex;background:rgba(0,0,0,.32);border-radius:99px;padding:3px;margin-top:14px;border:1px solid rgba(255,255,255,.16)}
.gate-lang button{padding:5px 15px;border-radius:99px;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.66);transition:.2s}
.gate-lang button.on{background:#fff;color:#3B1A63}
.gate-bd{padding:6px 26px 22px}
.gate-q{font-size:13.5px;font-weight:800;text-align:center;margin:8px 0 16px;color:rgba(255,255,255,.9)}
.gate-roles{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grole{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:20px 14px 16px;border-radius:22px;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.16);color:#fff;transition:.26s;text-align:center;overflow:hidden}
.grole::after{content:'';position:absolute;inset:-40% -60%;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.16) 50%,transparent 56%);
  transform:translateX(-60%);transition:transform .6s}
.grole:hover::after{transform:translateX(60%)}
.grole:hover{transform:translateY(-5px);background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.38);
  box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
/* transparent icons — no plate. A soft colour aura behind, plus a light
   halo on the artwork itself so the black outlines stay readable on dark. */
.grole .ic{position:relative;width:92px;height:92px;display:grid;place-items:center;margin-bottom:4px;transition:.26s}
.grole .ic::before{content:'';position:absolute;inset:-6px;border-radius:50%;pointer-events:none;transition:.3s;
  filter:blur(13px);opacity:.85}
.grole.eng .ic::before{background:radial-gradient(circle,rgba(139,79,214,.85),rgba(91,44,148,.35) 55%,transparent 72%)}
.grole.adm .ic::before{background:radial-gradient(circle,rgba(230,0,126,.8),rgba(245,130,32,.32) 55%,transparent 72%)}
.grole .ic img{width:78px;height:78px;object-fit:contain;display:block;position:relative;z-index:1;transition:.26s;
  filter:drop-shadow(0 0 2px rgba(255,255,255,.95)) drop-shadow(0 0 9px rgba(255,255,255,.5))
         drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.grole:hover .ic{transform:translateY(-4px)}
.grole:hover .ic::before{inset:-11px;opacity:1}
.grole:hover .ic img{transform:scale(1.09);
  filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 15px rgba(255,255,255,.75)) drop-shadow(0 8px 18px rgba(0,0,0,.6))}
.grole b{font-size:15px;font-weight:800}
.grole small{font-size:10.5px;color:rgba(255,255,255,.62);line-height:1.5;min-height:31px}
.grole .pill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;padding:3px 10px;
  border-radius:99px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);letter-spacing:.2px}
.gate-search input{width:100%;padding:11px 15px;border-radius:13px;border:1.5px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.26);color:#fff;font-size:13px;outline:none;transition:.2s;margin-bottom:11px}
.gate-search input::placeholder{color:rgba(255,255,255,.4)}
.gate-search input:focus{border-color:rgba(255,255,255,.55);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.gate-list{max-height:min(46vh,340px);overflow:auto;border-radius:15px;background:rgba(0,0,0,.2);padding:6px}
.gate-list::-webkit-scrollbar{width:8px}
.gate-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:99px}
.gsec{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;color:rgba(255,255,255,.55);
  padding:9px 10px 5px;letter-spacing:.4px}
.gsec .dbar{width:4px;height:13px;border-radius:99px}
.gitem{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:12px;color:#fff;transition:.16s;text-align:start}
.gitem:hover{background:rgba(255,255,255,.14);transform:translateX(-3px)}
html[dir="ltr"] .gitem:hover{transform:translateX(3px)}
.gitem .av{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:linear-gradient(135deg,#5B2C94,#E6007E);flex:0 0 auto}
.gitem b{flex:1;font-size:13px}
.gitem svg{opacity:.45;transform:rotate(90deg)}
html[dir="rtl"] .gitem svg{transform:rotate(-90deg)}
.gate-members{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
.gmem{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 12px;border-radius:99px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.pinbox{display:flex;justify-content:center}
.pinbox input{width:100%;max-width:280px;text-align:center;letter-spacing:14px;font-size:26px;font-weight:800;
  padding:15px 12px;border-radius:17px;border:1.5px solid rgba(255,255,255,.24);background:rgba(0,0,0,.32);
  color:#fff;outline:none;transition:.2s;direction:ltr}
.pinbox input::placeholder{letter-spacing:10px;color:rgba(255,255,255,.28)}
.pinbox input:focus{border-color:#FF6FB4;box-shadow:0 0 0 5px rgba(230,0,126,.22)}
.pinmsg{min-height:22px;text-align:center;margin-top:9px}
.pinmsg .bad{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#FF9BB4;
  animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.gate-back{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:13px;padding:9px;
  border-radius:11px;font-size:12px;font-weight:700;color:rgba(255,255,255,.6);transition:.16s}
.gate-back:hover{background:rgba(255,255,255,.09);color:#fff}
.gate-back svg{transform:rotate(90deg)}
html[dir="rtl"] .gate-back svg{transform:rotate(-90deg)}
.gate-note{display:flex;gap:8px;align-items:flex-start;margin-top:15px;padding:11px 13px;border-radius:12px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:10.5px;line-height:1.6;color:rgba(255,255,255,.66)}
.gate-note svg{flex:0 0 auto;margin-top:2px;opacity:.7}
.gate-ft{padding:13px;text-align:center;background:rgba(0,0,0,.34);border-top:1px solid rgba(255,255,255,.1);position:relative}
.gate-ft::before{content:'';position:absolute;top:0;inset-inline:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(102,245,255,.5),transparent)}
.gate-ft .cl{display:block;font-size:8px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  color:rgba(255,255,255,.4);transition:.35s}
/* the signature: a light pulse travels through the letters, like fibre */
.sig{position:relative;display:inline-block;direction:ltr;font-weight:800;cursor:default;
  transition:transform .35s cubic-bezier(.2,1.2,.4,1), filter .35s}
.sig .sig-t{display:inline-block;
  background:linear-gradient(100deg,#FFD9F0 0%,#FFC28A 18%,#FFFFFF 34%,#8BF7FF 46%,#FFFFFF 58%,#FFC28A 78%,#FFD9F0 100%);
  background-size:320% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:sigShine 6s linear infinite}
@keyframes sigShine{0%{background-position:320% 0}100%{background-position:-320% 0}}
.sig::after{content:'';position:absolute;inset-inline:0;bottom:-5px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.30),transparent);opacity:.9}
.sig .sig-dot{position:absolute;bottom:-6.5px;left:0;width:7px;height:3px;border-radius:99px;background:#8BF7FF;
  box-shadow:0 0 9px 2.5px rgba(102,245,255,.85);animation:sigDot 4.4s cubic-bezier(.55,0,.45,1) infinite}
@keyframes sigDot{0%{left:0;opacity:0}8%{opacity:1}88%{opacity:1}100%{left:calc(100% - 7px);opacity:0}}
.sig:hover{transform:translateY(-2px) scale(1.05);filter:drop-shadow(0 0 12px rgba(139,247,255,.55))}
.sig:hover .sig-t{animation-duration:1.6s}
.gate-ft:hover .cl{color:rgba(255,255,255,.72);letter-spacing:2.1px}
.gate-ft .sig{font-size:13.5px}
@media(max-width:520px){.gate-roles{grid-template-columns:1fr}.gate-hd h1{font-size:16px}.grole small{min-height:0}
  .gate-photo{object-position:center 46%}.gate-card{max-width:100%}
  .gate-caption{font-size:8.5px;letter-spacing:1px}}
@media(prefers-reduced-motion:reduce){.gate .scene *,.gate-photo{animation:none!important}.gate-card::before{animation:none}
  .sig .sig-t{animation:none;background-position:50% 0}.sig .sig-dot{display:none}}
/* role chip in header */
.role-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 6px 5px 12px;border-radius:99px;
  background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.18);white-space:nowrap}
html[dir="rtl"] .role-chip{padding:5px 12px 5px 6px}
.role-chip .rl{display:flex;flex-direction:column;line-height:1.2;align-items:flex-start}
.role-chip .rl small{font-size:8.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.5)}
.role-chip .rl b{font-size:12px;font-weight:800}
.role-chip .out{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);
  color:#fff;transition:.18s}
.role-chip .out:hover{background:var(--we-magenta);transform:rotate(90deg)}
.role-chip.adm{box-shadow:0 0 0 1px rgba(230,0,126,.5),0 0 16px rgba(230,0,126,.3)}
.ro-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  padding:4px 11px;border-radius:99px;font-size:10.5px;font-weight:800;white-space:nowrap}
.ro-tag svg{width:12px;height:12px}


/* ===== committee member cards ===== */
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mem{position:relative;border:1.5px solid var(--line);border-radius:18px;padding:14px;background:var(--surface-2);
  transition:.2s;overflow:hidden}
.mem::before{content:'';position:absolute;top:0;inset-inline:0;height:3px;background:var(--grad-brand);opacity:.55}
.mem:hover{transform:translateY(-3px);box-shadow:var(--sh-m);border-color:var(--we-violet)}
.mem.own{border-color:var(--we-magenta);background:linear-gradient(160deg,var(--shift-C-bg),var(--surface-2) 60%)}
.mem.own::before{opacity:1;height:4px}
.mem.off{opacity:.5;filter:grayscale(.6)}
.mem-top{display:flex;align-items:center;gap:7px;margin-bottom:9px;color:var(--we-purple)}
html[data-theme="dark"] .mem-top{color:#C79BFF}
.mem.own .mem-top{color:var(--we-magenta)}
.mem-role{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:2px 8px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line)}
.mem-nm{font-size:14.5px;font-weight:800;line-height:1.3}
.mem-sub{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.mem-pin{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:11px;font-weight:700;color:var(--ink-3);
  background:var(--surface);border:1px dashed var(--line);padding:3px 10px;border-radius:99px;letter-spacing:2px}
.mem-act{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.gmem.own{background:linear-gradient(135deg,rgba(230,0,126,.35),rgba(245,130,32,.25));border-color:rgba(255,255,255,.4)}


/* ===== multi-select action bar ===== */
.selbar{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 14px;flex:0 0 auto;
  background:linear-gradient(100deg,var(--shift-L-bg),var(--surface) 60%);
  border-bottom:1px solid var(--line);box-shadow:0 4px 14px -6px rgba(43,20,80,.25);
  animation:selIn .22s cubic-bezier(.2,1.1,.4,1)}
.selbar.on{display:flex}
@keyframes selIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.sb-n{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--we-purple);
  background:var(--surface);border:1.5px solid var(--we-violet);padding:5px 12px;border-radius:99px;white-space:nowrap}
html[data-theme="dark"] .sb-n{color:#C79BFF}
.sb-n b{font-size:15px;font-weight:800}
.sb-hint{font-size:11px;color:var(--ink-3);font-weight:600}
.sb-btns{display:flex;gap:6px;flex-wrap:wrap}
.sb-b{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  min-width:60px;height:46px;padding:0 8px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);font-size:16px;font-weight:800;transition:.16s;line-height:1}
.sb-b small{font-size:8.5px;font-weight:700;opacity:.75}
.sb-b em{position:absolute;top:3px;inset-inline-end:5px;font-style:normal;font-size:8px;font-weight:800;
  opacity:.45;background:var(--line-2);padding:0 4px;border-radius:4px}
.sb-b:hover{transform:translateY(-3px)}
.sb-b:disabled{opacity:.4;pointer-events:none}
.sb-b.S{color:var(--shift-S)} .sb-b.S:hover{background:var(--shift-S-bg);border-color:var(--shift-S);box-shadow:0 6px 16px var(--shift-S-glow)}
.sb-b.L{color:var(--shift-L)} .sb-b.L:hover{background:var(--shift-L-bg);border-color:var(--shift-L);box-shadow:0 6px 16px var(--shift-L-glow)}
.sb-b.C{color:var(--shift-C)} .sb-b.C:hover{background:var(--shift-C-bg);border-color:var(--shift-C);box-shadow:0 6px 16px var(--shift-C-glow)}
.sb-b.W{color:var(--shift-W)} .sb-b.W:hover{background:var(--shift-W-bg);border-color:var(--shift-W);box-shadow:0 6px 16px var(--shift-W-glow)}
.sb-b.R{color:var(--shift-R)} .sb-b.R:hover{background:var(--shift-R-bg);border-color:var(--shift-R);box-shadow:0 6px 16px var(--shift-R-glow)}
.sb-b.D{color:var(--shift-D)} .sb-b.D:hover{background:var(--shift-D-bg);border-color:var(--shift-D);box-shadow:0 6px 16px var(--shift-D-glow)}
.sb-b.E{color:var(--shift-E)} .sb-b.E:hover{background:var(--shift-E-bg);border-color:var(--shift-E);box-shadow:0 6px 16px var(--shift-E-glow)}
.sb-b.x{color:var(--ink-3);font-size:13px} .sb-b.x:hover{background:#FEF2F2;border-color:var(--err);color:var(--err)}
html[data-theme="dark"] .sb-b.x:hover{background:#3B1414}
td.c.msel .cb{transform:scale(.94)}
@media(max-width:820px){.sb-hint{display:none}.sb-b{min-width:48px;height:42px}.selbar{padding:8px 10px;gap:7px}}
/* ===== gate background preview ===== */
.bg-prev{position:relative;height:230px;border-radius:18px;overflow:hidden;border:1.5px solid var(--line);
  background-size:cover;background-repeat:no-repeat;display:grid;place-items:center}
.bg-prev.sm{height:150px}
.bg-veil{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(21,8,38,1) 0%,rgba(34,14,62,.52) 24%,rgba(42,17,71,.29) 46%,rgba(20,8,38,.86) 80%,rgba(10,4,22,1) 100%),
    radial-gradient(60% 70% at 50% 55%,rgba(91,44,148,.28),transparent 70%),
    radial-gradient(70% 50% at 50% 110%,rgba(230,0,126,.38),transparent 66%)}
.bg-card{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 22px;
  border-radius:16px;background:rgba(18,8,34,.5);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);text-align:center;max-width:82%}
.bg-card img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.bg-card b{font-size:12.5px;font-weight:800;color:#fff;
  background:linear-gradient(92deg,#fff 26%,#FFD9F0 62%,#FFC28A);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.bg-card span{font-size:10px;color:rgba(255,255,255,.7)}
.bg-tag{position:absolute;top:10px;inset-inline-start:10px;z-index:2;font-size:9.5px;font-weight:800;
  padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25)}
input[type=range]{width:100%;accent-color:var(--we-purple);height:26px}
/* ===== send hub cards ===== */
.send-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.send-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 14px 15px;border-radius:19px;
  border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);transition:.22s;text-align:center;position:relative;overflow:hidden}
.send-card::before{content:'';position:absolute;inset:0;opacity:0;transition:.22s;
  background:radial-gradient(circle at 50% 0%,rgba(139,79,214,.16),transparent 70%)}
.send-card:hover{transform:translateY(-5px);border-color:var(--we-violet);box-shadow:var(--sh-l)}
.send-card:hover::before{opacity:1}
.send-card .sc-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;position:relative;z-index:1;transition:.22s}
.send-card:hover .sc-ic{transform:scale(1.08) rotate(-4deg)}
.send-card.g1 .sc-ic{background:linear-gradient(135deg,#25D366,#0F9D58);box-shadow:0 8px 22px rgba(37,211,102,.45)}
.send-card.g2 .sc-ic{background:linear-gradient(135deg,#5B2C94,#8B4FD6);box-shadow:0 8px 22px var(--shift-L-glow)}
.send-card.g3 .sc-ic{background:linear-gradient(135deg,#E6007E,#F58220);box-shadow:0 8px 22px var(--shift-C-glow)}
.send-card.g4 .sc-ic{background:linear-gradient(135deg,#0891B2,#4F46E5);box-shadow:0 8px 22px rgba(8,145,178,.4)}
.send-card b{font-size:13.5px;font-weight:800;position:relative;z-index:1}
.send-card small{font-size:10.5px;color:var(--ink-3);line-height:1.5;min-height:31px;position:relative;z-index:1}
.send-card .sc-go{font-size:10.5px;font-weight:800;padding:4px 12px;border-radius:99px;background:var(--surface);
  border:1px solid var(--line);position:relative;z-index:1;transition:.22s}
.send-card:hover .sc-go{background:var(--grad-brand);color:#fff;border-color:transparent}

</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<div class="gate" id="gate"></div>
<header class="hdr">
  <svg class="fib" viewBox="0 0 1200 64" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="hp" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="45%" stop-color="#fff" stop-opacity=".95"/>
        <stop offset="55%" stop-color="#66F5FF" stop-opacity=".95"/><stop offset="100%" stop-color="#66F5FF" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M-20 50 C 220 22, 420 62, 640 38 C 860 14, 1010 54, 1220 30" fill="none" stroke="#B98CF0" stroke-width="1" opacity=".28"/>
    <path d="M-20 50 C 220 22, 420 62, 640 38 C 860 14, 1010 54, 1220 30" fill="none" stroke="url(#hp)" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="22 1300" stroke-dashoffset="1322">
      <animate attributeName="stroke-dashoffset" from="1322" to="0" dur="5.5s" repeatCount="indefinite"/></path>
    <path d="M-20 20 C 260 44, 480 8, 700 30 C 920 52, 1040 16, 1220 42" fill="none" stroke="#FF6FB4" stroke-width=".9" opacity=".22"/>
    <path d="M-20 20 C 260 44, 480 8, 700 30 C 920 52, 1040 16, 1220 42" fill="none" stroke="url(#hp)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="18 1300" stroke-dashoffset="1318">
      <animate attributeName="stroke-dashoffset" from="1318" to="0" dur="7.2s" begin="1.4s" repeatCount="indefinite"/></path>
  </svg>
  <div class="hdr-in">
    <div class="brand">
      <img class="logo" id="logoImg" alt="WE Telecom Egypt">
      <div class="ttl">
        <h1 id="appTitle" class="gtext">الوردية الموحدة لمهندسين وسط الدلتا</h1>
        <p id="appSub">Middle Delta • Unified Engineering Shift Management System</p>
      </div>
    </div>
    <div class="hdr-sp"></div>
    <button class="cyc-chip hide-sm" id="cycChip" onclick="UI.openCycles()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.25">
        <b id="cycName">—</b><span id="cycRange">—</span>
      </span>
      <span id="cycBadge" class="ok-pill">30</span>
    </button>
    <button class="hbtn hide-sm" id="warnBtn" onclick="UI.openWarnings()" title="Warnings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <span id="warnCount">0</span>
    </button>
    <button class="hbtn hide-sm" onclick="UI.toggleTheme()" title="Theme"><span id="themeIco"></span></button>
    <div class="role-chip hide-sm" id="roleChip"></div>
    <div class="credit hide-sm" title="Powered By Eng. Ahmed Rozaiq">
      <span class="cl" id="credLbl">Powered By</span>
      <span class="sig"><span class="sig-t gtext">Eng. Ahmed Rozaiq</span><span class="sig-dot"></span></span>
    </div>
    <div class="lang-sw">
      <button id="langAr" class="on" onclick="I18N.set('ar')">العربية</button>
      <button id="langEn" onclick="I18N.set('en')">English</button>
    </div>
  </div>
</header>

<!-- ============ NAV ============ -->
<nav class="nav" id="nav"></nav>

<!-- ============ MAIN ============ -->
<div class="main">
  <div class="stage">

    <!-- ===== ROSTER ===== -->
    <section class="view on" id="v-roster">
      <div class="tools">
        <button class="tbtn primary" id="myPanelBtn" style="display:none" onclick="EngMode.openMine()"></button>
        <button class="tbtn primary adm-only" id="engReqBtn" style="display:none" onclick="EngMode.reqOpen()"></button>
        <button class="tbtn primary" id="fitBtn" onclick="Roster.fit()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          <span data-t="fitFull">عرض الجدول بالكامل</span>
        </button>
        <div class="seg">
          <button id="dCompact" onclick="Roster.setDensity('compact')" data-t="compact">مضغوط</button>
          <button id="dNormal" class="on" onclick="Roster.setDensity('normal')" data-t="normal">عادي</button>
          <button id="dComfy" onclick="Roster.setDensity('comfy')" data-t="comfy">مريح</button>
        </div>
        <div class="tsep admtool"></div>
        <button class="tbtn admtool" id="undoBtn" onclick="Data.undo()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
          <span data-t="undo">تراجع</span><span class="ub" id="undoCount"></span></button>
        <button class="tbtn admtool" id="redoBtn" onclick="Data.redo()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
          <span data-t="redo">إعادة</span></button>
        <div class="tsep admtool"></div>

/* Safety net: if anything fails (old browser, blocked storage, in-app
   WebView) show a readable message instead of a blank white screen. */
(function(){
  var shown=false;
  function boom(msg,src){
    if(shown) return; shown=true;
    try{
      var d=document.getElementById('fatal'); if(!d) return;
      d.className='on';
      d.innerHTML='<div class="fatal-box">'
        +'<div class="fatal-h">تعذّر تشغيل التطبيق على هذا المتصفح</div>'
        +'<p>جرّب فتح الملف في <b>Chrome</b> أو <b>Safari</b> مباشرة، وليس من داخل واتساب أو البريد.</p>'
        +'<p class="fatal-en">Could not start. Please open this file directly in Chrome or Safari, not inside the WhatsApp / mail in-app browser.</p>'
        +'<code>'+String(msg||'').slice(0,220)+(src?('\n'+String(src).slice(0,120)):'')+'</code></div>';
    }catch(e){}
  }
  window.addEventListener('error',function(e){ boom(e.message,e.filename+':'+e.lineno); });
  window.addEventListener('unhandledrejection',function(e){ boom((e.reason&&e.reason.message)||e.reason,''); });
  window.__weBoom=boom;
  /* gradient text: if the engine cannot clip a background to text, drop the
     gradient entirely instead of painting a solid bar over invisible text */
  try{
    var okClip = !!(window.CSS && CSS.supports &&
      (CSS.supports('-webkit-background-clip','text') || CSS.supports('background-clip','text')));
    if(!okClip) document.documentElement.className += ' no-clip';
  }catch(e){ try{ document.documentElement.className += ' no-clip'; }catch(e2){} }
  /* storage may throw in private mode / file:// on iOS — use a memory fallback */
  try{ localStorage.setItem('__we_t','1'); localStorage.removeItem('__we_t'); }
  catch(err){
    var mem={};
    try{ Object.defineProperty(window,'localStorage',{configurable:true,value:{
      getItem:function(k){return k in mem?mem[k]:null;},
      setItem:function(k,v){mem[k]=String(v);},
      removeItem:function(k){delete mem[k];},
      clear:function(){mem={};}
    }}); }catch(e2){}
  }
})();
</script>

const SwapCode = {
  PREFIX:'WE-SWP1',
  _b64e(s){ const b=new TextEncoder().encode(s); let x=''; b.forEach(c=>x+=String.fromCharCode(c));
    return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  _b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
    const bin=atob(s), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return new TextDecoder().decode(u); },
  _sum(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; }
    return h.toString(36).toUpperCase().padStart(7,'0').slice(-7); },
  encode(o){ const j=JSON.stringify(o), p=this._b64e(j); return this.PREFIX+'.'+p+'.'+this._sum(p); },
  decode(code){
    const raw=String(code||'').trim().replace(/\s+/g,'');
    const m=raw.match(/WE-SWP1\.([A-Za-z0-9\-_]+)\.([A-Z0-9]{7})/);
    if(!m) return {ok:false,err:'format'};
    if(this._sum(m[1])!==m[2]) return {ok:false,err:'checksum'};
    try{ const o=JSON.parse(this._b64d(m[1]));
      if(!o||o.v!==1||!o.d||!o.a||!o.b) return {ok:false,err:'payload'};
      return {ok:true,req:o}; }catch(e){ return {ok:false,err:'parse'}; }
  },
  findAll(t){ const out=[], re=/WE-SWP1\.[A-Za-z0-9\-_]+\.[A-Z0-9]{7}/g; let m;
    while((m=re.exec(String(t||'')))) out.push(m[0]); return out; },

  /* ---- SHORT CODE: 6 characters ------------------------------------
     Both sides already hold the same roster, so the code only has to
     say WHO, WITH WHOM and WHICH DAY. We pack the two engineer numbers
     and the day index into 5 base-36 chars + 1 check character.      */
  B36:'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  _e36(n,len){ let s=''; n=Math.max(0,Math.floor(n));
    while(n>0){ s=this.B36[n%36]+s; n=Math.floor(n/36); }
    while(s.length<len) s='0'+s; return s; },
  _d36(s){ let n=0; for(let i=0;i<s.length;i++){ const k=this.B36.indexOf(s[i]); if(k<0) return -1; n=n*36+k; } return n; },
  _ck(s){ let h=7; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%36; return this.B36[h]; },
  MAXNO:255, MAXDAY:63,
  canShort(aNo,bNo,dayIdx){
    return aNo>=0&&bNo>=0&&dayIdx>=0&&aNo<=this.MAXNO&&bNo<=this.MAXNO&&dayIdx<=this.MAXDAY;
  },
  shortEncode(aNo,bNo,dayIdx){
    if(!this.canShort(aNo,bNo,dayIdx)) return null;
    const body=this._e36(aNo*16384 + bNo*64 + dayIdx, 5);
    return body+this._ck(body);
  },
  shortDecode(code){
    const c=String(code||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
    if(c.length!==6) return null;
    const body=c.slice(0,5), ck=c.slice(5);
    if(this._ck(body)!==ck) return null;

    return {a:Math.floor(n/16384)%256, b:Math.floor(n/64)%256, d:n%64};
  },
  findShort(t){
    const out=[], re=/\b[0-9A-Z]{6}\b/gi; let m;
    const txt=String(t||'').replace(/WE-SWP1\.[A-Za-z0-9\-_]+\.[A-Z0-9]{7}/g,' ');

      if(this.shortDecode(c) && out.indexOf(c)<0) out.push(c); }
    return out;
  }

  warnings(){

    if(ds.length!==30) w.push({lvl:'warn',k:'wCycleLen',d:ds.length+' '+I18N.t('days')});
    const names={};

      const st=this.stats(e.id);
      if(!e.email) w.push({lvl:'warn',k:'wNoEmail',d:e.name,eng:e.id});
      if(!e.email && st.L>0) w.push({lvl:'err',k:'wNightNoEmail',d:e.name+' — '+st.L+' × ل',eng:e.id});
      if(st.total===0) w.push({lvl:'info',k:'wNoShifts',d:e.name,eng:e.id});
      const nk=normName(e.name); names[nk]=(names[nk]||0)+1;
    });

      d:g.list.map(e=>e.name).join('  ⟷  '), dup:g.list[0].id}));
    ds.forEach(d=>{ if(this.dayCount(d).total===0) w.push({lvl:'info',k:'wEmptyDay',d:fmtDate(d)}); });
    return w;
  },
  /* --- duplicate handling (never automatic — the admin decides) --- */
  /* Returns [{exact, list:[eng,...]}]
     exact  = identical after Arabic normalisation (certain duplicate)
     !exact = one name is a word-prefix of the other in the SAME department
              (e.g. "مصطفى" vs "مصطفى حمادة") — likely the same person,
              surfaced for the admin to confirm, never merged automatically. */
  findDups(){
    const engs=this.state.engineers, groups=[], used=new Set(), keyed={};
    engs.forEach(e=>{ const k=normName(e.name); (keyed[k]=keyed[k]||[]).push(e); });
    Object.keys(keyed).forEach(k=>{ const g=keyed[k];
      if(g.length>1){ g.forEach(e=>used.add(e.id)); groups.push({exact:true,list:g}); } });
    const rest=engs.filter(e=>!used.has(e.id));
    for(let i=0;i<rest.length;i++){
      if(used.has(rest[i].id)) continue;
      const ti=normName(rest[i].name).split(' '), grp=[rest[i]];
      for(let j=i+1;j<rest.length;j++){
        if(used.has(rest[j].id)) continue;
        const tj=normName(rest[j].name).split(' ');
        if(ti.length===tj.length) continue;
        const n=Math.min(ti.length,tj.length);
        if(ti.slice(0,n).join(' ')===tj.slice(0,n).join(' ') && rest[i].dept===rest[j].dept) grp.push(rest[j]);
      }
      if(grp.length>1){ grp.forEach(e=>used.add(e.id)); groups.push({exact:false,list:grp}); }
    }
    return groups;
  },
  dupGroupOf(id){ return this.findDups().find(g=>g.list.some(e=>e.id===id)) || null; },
  mergeEngineers(keepId, dropIds){
    if(typeof Auth!=='undefined' && !Auth.can()) return;
    const PRIO={L:3,C:2,S:1};
    this.snap('merge');
    Object.keys(this.state.assign).forEach(cid=>{
      const A=this.state.assign[cid]; if(!A[keepId]) A[keepId]={};
      dropIds.forEach(id=>{
        const src=A[id]; if(!src) return;
        Object.keys(src).forEach(d=>{
          const cur=A[keepId][d], v=src[d];
          if(!cur || PRIO[v]>PRIO[cur]) A[keepId][d]=v;
        });
        delete A[id];
      });
    });
    const keep=this.eng(keepId);
    dropIds.forEach(id=>{
      const e=this.eng(id); if(!e) return;
      if(!keep.email && e.email) keep.email=e.email;
      if(keep.name.trim().split(/\s+/).length===1 && e.name.trim().split(/\s+/).length>1) keep.name=e.name;
    });
    this.state.swaps.forEach(s2=>{ if(dropIds.includes(s2.a))s2.a=keepId; if(dropIds.includes(s2.b))s2.b=keepId; });
    this.state.history.forEach(h=>{ if(dropIds.includes(h.eng))h.eng=keepId; });
    this.state.emailQueue.forEach(m=>{ if(dropIds.includes(m.eng))m.eng=keepId; });
    this.state.engineers=this.state.engineers.filter(e=>!dropIds.includes(e.id));
    if(dropIds.includes(this.state.selectedEng)) this.state.selectedEng=keepId;
    this.state.compare=this.state.compare.map(id=>dropIds.includes(id)?keepId:id).filter((v,i,a)=>a.indexOf(v)===i);
    this.state.history.push({id:uid('h'),ts:Date.now(),type:'merge',eng:keepId,note:keep.name+' ← '+dropIds.length});
    this.save();
  },
  reset(){ try{ localStorage.removeItem(this.KEY); localStorage.removeItem('we_mdelta_role_v1'); }catch(e){} location.reload(); }
};

  cellClick(ev,engId,date){
    ev.stopPropagation();

    if(this.selMode){
      const k=engId+'|'+date;
      if(ev.shiftKey){ this.selectRange(engId,date); this.render(); this.syncSel(); return; }
      if(this.sel.has(k)) this.sel.delete(k); else { this.sel.add(k); this._anchor={e:engId,d:date}; }
      const td=ev.currentTarget.parentElement; td.classList.toggle('msel',this.sel.has(k));
      this.syncSel(); return;
    }
    Pop.open(ev.currentTarget, engId, date);

  quickSet(engId,date,shift){
    if(!Auth.can()) return;

    if(Data.state.selectedEng===engId) Side.open(engId,true);
    UI.syncUndo(); UI.softRefresh();
  },
  fillSel(shift){
    if(!Auth.can()) return;
    if(!this.sel.size){ UI.toast(I18N.t('nothingSel'),'warn'); return; }
    Data.snap('fill'); let n=0;
    this.sel.forEach(k=>{ const i=k.indexOf('|'); const e=k.slice(0,i), d=k.slice(i+1);
      if(Data.set(e,d,shift,{noSnap:true})) n++; });
    this.sel.clear(); this._anchor=null;
    this.syncSel(); this.render(); UI.syncUndo(); UI.softRefresh();
    UI.toast(shift?(ST[shift].lbl+' · '+I18N.t('filled',{n})):I18N.t('filled',{n}),'ok',true);
  },
  copySel(){ if(!this.sel.size){ UI.toast(I18N.t('nothingSel'),'warn'); return; }
    this.clip=Array.from(this.sel).map(k=>{const[e,d]=k.split('|'); return {d, v:Data.get(e,d)};});
    UI.toast(I18N.t('copied')+' ('+this.clip.length+')','ok'); },
  pasteTo(engId){ if(!Auth.can()) return; if(!this.clip||!this.clip.length) return;
    Data.snap('paste'); this.clip.forEach(c=>Data.set(engId,c.d,c.v,{noSnap:true}));
    this.render(); UI.syncUndo(); UI.softRefresh(); UI.toast(I18N.t('updated'),'ok',true); }
};

      +'<div class="pop-row">'+SK.map(B).join('')

      +'<span class="pd-b">'+LEAVE_K.map(k=>'<button class="pd '+k+'" onclick="Pop.wholeDay(\''+k+'\')" title="'+esc(shiftFull(k))+'">'+ST[k].lbl+'</button>').join('')

  paste(){ if(this.cur) Roster.pasteTo(this.cur.engId); this.close(); },
  wholeDay(k){

    const d=this.cur.date; this.close();

};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ Pop.close(); UI.closeModal(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){ e.preventDefault(); Data.undo(); }
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){ e.preventDefault(); Data.redo(); }
  if(Roster.selMode && Roster.sel.size){
    const i=parseInt(e.key,10);
    if(i>=1 && i<=SK.length){ e.preventDefault(); Roster.fillSel(SK[i-1]); }
    if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); Roster.fillSel(null); }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){ e.preventDefault(); Roster.selectAllVisible(); }
  }
});

/* ------------------ CHARTS (hand-built SVG) ------------------ */
const Chart = {
  COL:SHIFT_TYPES.reduce((o,t)=>(o[t.k]=t.col,o),{}),
  donut(data,size,thick,keys){
    size=size||168; thick=thick||26;
    keys=keys||SK.filter(k=>data[k]); if(!keys.length) keys=DUTY_K;
    const tot=keys.reduce((a,k)=>a+(data[k]||0),0);
    const R=size/2-4, r=R-thick, cx=size/2, cy=size/2;
    let ang=-Math.PI/2, paths='';
    if(tot===0){
      paths='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" stroke="var(--line-2)" stroke-width="'+thick+'"/>';
    } else keys.forEach((k,i)=>{
      const v=data[k]||0; if(!v) return;
      const a=v/tot*Math.PI*2, a2=ang+a, large=a>Math.PI?1:0;
      const p=(rad,t)=>[(cx+rad*Math.cos(t)).toFixed(2),(cy+rad*Math.sin(t)).toFixed(2)];
      const [x1,y1]=p(R,ang),[x2,y2]=p(R,a2),[x3,y3]=p(r,a2),[x4,y4]=p(r,ang);
      paths+='<path class="donut-seg" d="M'+x1+' '+y1+' A'+R+' '+R+' 0 '+large+' 1 '+x2+' '+y2+' L'+x3+' '+y3+' A'+r+' '+r+' 0 '+large+' 0 '+x4+' '+y4+' Z" fill="'+this.COL[k]+'" opacity="0"><title>'+esc(shiftName(k))+': '+v+' ('+Math.round(v/tot*100)+'%)</title>'
        +'<animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="'+(i*0.11)+'s" fill="freeze"/></path>';
      ang=a2;
    });
    return '<div class="dchart" style="width:'+size+'px;height:'+size+'px">'
      +'<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" style="transform-origin:center;animation:pop .5s cubic-bezier(.2,1.2,.4,1)">'+paths+'</svg>'
      +'<div class="ctr"><div class="v">'+tot+'</div><div class="l">'+esc(I18N.t('total'))+'</div></div></div>';
  },
  bars(data,keys){
    keys=keys||SK.filter(k=>data[k]); if(!keys.length) keys=DUTY_K;
    const mx=Math.max(1,...keys.map(k=>data[k]||0));
    return keys.map(k=>{
      const v=data[k]||0, pct=Math.round(v/mx*100);
      return '<div class="barrow"><span class="bl"><b style="color:'+this.COL[k]+'">'+ST[k].lbl+'</b> '+esc(shiftName(k))+'</span>'
        +'<span class="btr"><span class="bfl bar-t" style="width:0;background:linear-gradient(90deg,'+this.COL[k]+'dd,'+this.COL[k]+')" data-w="'+pct+'">'+v+'</span></span></div>';
    }).join('');
  },
  animBars(root){ setTimeout(()=>{ (root||document).querySelectorAll('.bfl[data-w]').forEach(b=>{ b.style.width=Math.max(9,+b.dataset.w)+'%'; }); },40); },
  grouped(items,keys){
    keys=keys||DUTY_K.filter(k=>items.some(i=>i[k]));
    if(!keys.length) keys=DUTY_K;
    const mx=Math.max(1,...items.flatMap(i=>keys.map(k=>i[k]||0)));
    return '<div class="gbars">'+items.map(i=>'<div class="ggrp"><div class="bars">'
      +keys.map(k=>'<div class="bar" style="height:0;background:linear-gradient(180deg,'+this.COL[k]+',' +this.COL[k]+'bb)" data-h="'+Math.max(3,Math.round((i[k]||0)/mx*168))+'"><span>'+(i[k]||0)+'</span></div>').join('')
      +'</div><div class="lb" title="'+esc(i.label)+'">'+esc(i.label)+'</div></div>').join('')+'</div>';
  },
  animGrouped(root){ setTimeout(()=>{ (root||document).querySelectorAll('.ggrp .bar[data-h]').forEach(b=>{ b.style.height=b.dataset.h+'px'; }); },40); }
};

Roster.markDay=function(date,k){
  if(!Auth.can()) return;
  Data.snap('markDay');
  let n=0;
  Data.engs(true).forEach(e=>{
    if(k){ if(Data.set(e.id,date,k,{noSnap:true})) n++; }
    else { const v=Data.get(e.id,date);
           if(v && LEAVE_K.indexOf(v)>=0 && Data.set(e.id,date,null,{noSnap:true})) n++; }
  });
  if(!n){ Data._undo.pop(); UI.syncUndo(); return; }
  this.render(); UI.syncUndo(); UI.softRefresh();
  if(Data.state.selectedEng) Side.open(Data.state.selectedEng,true);
  UI.toast(k?I18N.t('dayMarked',{d:fmtShort(date),t:shiftName(k)}):I18N.t('dayCleared'),'ok',true);
};
Roster.goto=function(d){
  const th=document.querySelector('th[data-d="'+d+'"]');
  if(th) th.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  document.querySelectorAll('td.c[data-d="'+d+'"]').forEach(td=>{ td.classList.add('pulse'); setTimeout(()=>td.classList.remove('pulse'),2400); });
};

  },

    const engs=Data.engs(true), ds=Data.dates();
    const sel=(id,val,fn,arr,lbl)=>'<select id="'+id+'" onchange="'+fn+'">'+arr.map(o=>'<option value="'+esc(o.v)+'"'+(o.v===val?' selected':'')+'>'+esc(o.l)+'</option>').join('')+'</select>';

      +(same?'<div class="note w">'+svg('warn')+'<div>'+esc(I18N.t('swapSame'))+'</div></div>':'')
      +'<div class="swapviz">'
      +'<div class="swapcol"><div class="h">'+esc(I18N.t('before'))+'</div>'
        +'<div class="swaprow"><span class="nm2">'+esc(A?A.name:'')+'</span>'+this.badge(av)+'</div>'
        +'<div class="swaprow"><span class="nm2">'+esc(B?B.name:'')+'</span>'+this.badge(bv)+'</div></div>'
      +'<div class="swaparrow">'+svg('swaps',24)+'</div>'

        +'<div class="swaprow"><span class="nm2">'+esc(A?A.name:'')+'</span>'+this.badge(bv)+'</div>'
        +'<div class="swaprow"><span class="nm2">'+esc(B?B.name:'')+'</span>'+this.badge(av)+'</div></div></div>'
      +'<div class="fld" style="margin-top:14px"><label>'+esc(I18N.t('reason'))+'</label><input id="swR" placeholder="—"></div>'
      +(Data.state.settings.notifyOnSwap ? '<div class="note i">'+svg('mail')+'<div>'+esc(I18N.t('emailSubjS'))+' — '
        +[A,B].filter(Boolean).map(e=>esc(e.name)+(e.email?' ✓':' <b>('+esc(I18N.t('noEmail'))+')</b>')).join(' · ')+'</div></div>' : '');
    UI.modal({title:I18N.t('swapShift'), icon:'swaps', wide:true, body:bd,
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('cancel'))+'</button>'
        +'<button class="btn btn-p" '+(same?'disabled':'')+' onclick="Swap.confirm()">'+svg('check',14)+esc(I18N.t('confirmSwap'))+'</button>'});
  },
  badge(v){ return v?'<span class="tag" style="background:var(--shift-'+v+'-bg);color:var(--shift-'+v+');border:1px solid var(--shift-'+v+'-bd);font-size:12px;padding:3px 10px" title="'+esc(shiftFull(v))+'">'+ST[v].lbl+' '+esc(shiftName(v))+'</span>'
    :'<span class="tag off">—</span>'; },
  confirm(){
    if(!Auth.can()) return;
    if(this.a===this.b) return;
    const note=($('#swR')&&$('#swR').value.trim())||'';
    const av=Data.get(this.a,this.date), bv=Data.get(this.b,this.date);
    Data.snap('swap');
    Data.set(this.a,this.date,bv,{noSnap:true});
    Data.set(this.b,this.date,av,{noSnap:true});
    const rec={id:uid('s'),ts:Date.now(),cycle:Data.state.activeCycle,date:this.date,
      a:this.a,b:this.b,aOld:av,aNew:bv,bOld:bv,bNew:av,note};
    Data.state.swaps.push(rec);
    Data.state.history.push({id:uid('h'),ts:Date.now(),type:'swap',eng:this.a,date:this.date,from:av,to:bv,note:note||'swap'});

      +'<th>'+esc(I18N.t('engB'))+'</th><th>'+esc(I18N.t('oldShift'))+' → '+esc(I18N.t('newShift'))+'</th><th>'+esc(I18N.t('changedAt'))+'</th><th>'+esc(I18N.t('reason'))+'</th></tr></thead><tbody>';
    if(!sw.length) h+='<tr><td colspan="6" style="text-align:center;padding:34px;color:var(--ink-3)">'+esc(I18N.t('noSwaps'))+'</td></tr>';
    sw.forEach(s=>{ const A=Data.eng(s.a),B=Data.eng(s.b);
      h+='<tr><td><b>'+esc(fmtShort(s.date))+'</b><br><span style="font-size:10px;color:var(--ink-3)">'+esc(dowName(s.date))+'</span></td>'
        +'<td>'+esc(A?A.name:'—')+'</td><td>'+esc(B?B.name:'—')+'</td>'
        +'<td>'+esc(A?A.name:'')+': '+this.badge(s.aOld)+' → '+this.badge(s.aNew)+'<br style="line-height:2.2">'
        +esc(B?B.name:'')+': '+this.badge(s.bOld)+' → '+this.badge(s.bNew)+'</td>'
        +'<td style="font-size:11px;color:var(--ink-3)">'+new Date(s.ts).toLocaleString(I18N.lang==='ar'?'ar-EG':'en-GB')+'</td>'
        +'<td style="font-size:11px">'+esc(s.note||'—')+'</td></tr>'; });
    h+='</tbody></table></div></div>';
    $('#swapHost').innerHTML=h;
  }
};

/* ------------------ NOTIFICATIONS ------------------ */
const Notify = {
  tpl(kind,eng,payload){
    const L=eng.lang==='en'?'en':'ar';
    const nm=(L==='ar'?'م. ':'Eng. ')+eng.name;
    const dstr=(()=>{ const d=parseISO(payload.date); const dn=T[L][DOWK[d.getDay()]], mn=T[L]['m'+d.getMonth()];
      return dn+' '+d.getDate()+' '+mn+' '+d.getFullYear(); })();
    if(kind==='reminder'){
      return L==='ar'
        ? {subject:'تذكير بالوردية – WE',
           body:'مرحبًا '+nm+'،\n\nنذكرك بأن لديك وردية "ل" يوم '+dstr+'.\n\nمع تمنياتنا بيوم عمل موفق.\n\nWE Unified Shift Management System\nالإدارة العامة لتراسل وسط الدلتا'}
        : {subject:'WE Shift Reminder',
           body:'Hello '+nm+',\n\nThis is a reminder that you have an upcoming shift "ل" on '+dstr+'.\n\nWE Unified Shift Management System\nMiddle Delta Transmission'};
    }
    const nmOf=k=>k?(ST[k].lbl+' ('+(L==='en'?ST[k].en:ST[k].ar)+', '+shiftHours(k)+(L==='ar'?' س':'h')+')'):'—';
    const so=nmOf(payload.old), sn=nmOf(payload.neu);
    return L==='ar'
      ? {subject:'تحديث جدول الوردية – WE',
         body:'مرحبًا '+nm+'،\n\nتم تبديل وردية يوم '+dstr+'.\n\nالوردية القديمة: '+so+'\nالوردية الجديدة: '+sn+'\n'+(payload.note?'ملاحظة: '+payload.note+'\n':'')+'\nتم تحديث جدول الوردية.\n\nWE Unified Shift Management System'}
      : {subject:'WE Shift Roster Update',
         body:'Hello '+nm+',\n\nYour shift on '+dstr+' has been swapped.\n\nOld shift: '+so+'\nNew shift: '+sn+'\n'+(payload.note?'Note: '+payload.note+'\n':'')+'\nThe roster has been updated.\n\nWE Unified Shift Management System'};
  },
  queueSwap(rec){
    [[rec.a,rec.aOld,rec.aNew],[rec.b,rec.bOld,rec.bNew]].forEach(([id,o,n])=>{
      const e=Data.eng(id); if(!e) return;
      const m=this.tpl('swap',e,{date:rec.date,old:o,neu:n,note:rec.note});
      Data.state.emailQueue.push({id:uid('m'),ts:Date.now(),kind:'swap',eng:id,to:e.email||'',
        lang:e.lang||'ar',subject:m.subject,body:m.body,date:rec.date,status:e.email?'pending':'no-email'});
    });
    Data.save(); this.push();
  },
  nightUpcoming(){
    const A=Data.A(), today=iso(new Date()), out=[];
    Data.engs(true).forEach(e=>{ const m=A[e.id]||{};
      Data.dates().forEach(d=>{ if(m[d]==='L' && d>=today) out.push({eng:e,date:d}); }); });
    return out.sort((a,b)=>a.date<b.date?-1:1);
  },
  sendAt(date){ const s=Data.state.settings;
    const d=parseISO(date);
    if(s.sendMode==='time'){ const[h,mi]=(s.sendTime||'18:00').split(':').map(Number);
      d.setDate(d.getDate()-1); d.setHours(h,mi,0,0); return d; }
    d.setHours(0,0,0,0); return new Date(d.getTime()-(s.leadHours||24)*36e5);
  },
  buildReminders(){
    const s=Data.state.settings; if(!s.nightReminder) return [];
    return this.nightUpcoming().map(x=>{
      const m=this.tpl('reminder',x.eng,{date:x.date});
      return {eng:x.eng, date:x.date, to:x.eng.email||'', lang:x.eng.lang||'ar',
        subject:m.subject, body:m.body, sendAt:this.sendAt(x.date),
        status: !x.eng.email ? 'no-email' : 'scheduled'};
    });
  },
  async push(){
    const url=(Data.state.settings.webhook||'').trim();
    const pend=Data.state.emailQueue.filter(m=>m.status==='pending');
    if(!url||!pend.length) return;
    for(const m of pend){
      try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({type:m.kind,to:m.to,lang:m.lang,subject:m.subject,body:m.body,date:m.date,source:'we-mdelta-roster'})});
        m.status = r.ok?'sent':'failed'; m.sentAt=Date.now();
      }catch(err){ m.status='failed'; m.error=String(err.message||err); }
    }
    Data.save(); if(Data.state.view==='notify') Notify.render();
  },
  async test(){
    const url=($('#whUrl').value||'').trim();
    if(!url){ UI.toast(I18N.t('notConfigured'),'warn'); return; }
    Data.state.settings.webhook=url; Data.save();
    UI.toast('...','ok');
    try{ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({type:'test',subject:'WE Roster — connection test',body:'Connection test from WE Unified Shift Roster.',source:'we-mdelta-roster'})});
      UI.toast(r.ok?('✓ '+I18N.t('configured')+' ('+r.status+')'):('✕ HTTP '+r.status), r.ok?'ok':'err');
    }catch(e){ UI.toast('✕ '+e.message,'err'); }
    this.render();
  },
  mailto(m){ location.href='mailto:'+encodeURIComponent(m.to)+'?subject='+encodeURIComponent(m.subject)+'&body='+encodeURIComponent(m.body); },
  render(){

  /* the name is never overwritten — it is only filled when asked for */
  suggestName(s,e,lang){

         + parseISO(e).getDate()+' '+T2['m'+parseISO(e).getMonth()]+' '+parseISO(e).getFullYear();

  suggest(){
    const s=$('#cS').value, e=$('#cE').value;

    $('#cN').value=this.suggestName(s,e,'ar');
    $('#cNe').value=this.suggestName(s,e,'en');
  },
  calc(){
    const s=$('#cS').value, e=$('#cE').value; const box=$('#cInfo'); if(!box) return;
    if(!s||!e||e<s){ box.innerHTML='<div class="note e">'+svg('warn')+'<div>'+esc(I18N.t('endDate'))+' ≥ '+esc(I18N.t('startDate'))+'</div></div>'; return; }
    const n=daysBetween(s,e);
    box.innerHTML = n===30
      ? '<div class="note s">'+svg('check')+'<div><b>✓ 30-Day Shift Cycle</b> — '+esc(I18N.t('cycleOk'))+'</div></div>'
      : '<div class="note w">'+svg('warn')+'<div><b>'+esc(I18N.t('cycleWarn'))+'</b> — '+esc(I18N.t('cycleWarnMsg',{n}))+'</div></div>';

    if(nf && !nf.value.trim()) nf.placeholder=this.suggestName(s,e,I18N.lang);
