.logo{width:44px;height:44px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 22px rgba(230,0,126,.55);

.brand{display:flex;align-items:center;gap:12px;min-width:0}

/* grid */
.main{position:relative;z-index:1;flex:1;display:flex;min-height:0;overflow:hidden}

th.we .dh{background:linear-gradient(180deg,rgba(91,44,148,.26),rgba(91,44,148,.09));border-radius:9px 9px 0 0}

th.hol-D .dh{background:linear-gradient(180deg,rgba(4,120,87,.42),rgba(4,120,87,.16))}

th.hol-D .dh::before,th.hol-D .hol-tag{background:var(--shift-D)}
th.hol-E .dh::before,th.hol-E .hol-tag{background:var(--shift-E)}
th.hol-R .dh .dw,th.hol-R .dh .dd,th.hol-R .dh .dm{color:var(--shift-R)}
th.hol-D .dh .dw,th.hol-D .dh .dd,th.hol-D .dh .dm{color:var(--shift-D)}
th.hol-E .dh .dw,th.hol-E .dh .dd,th.hol-E .dh .dm{color:var(--shift-E)}
td.c.holc-R{background:rgba(100,116,139,.20)}

  dayLeave(d){ const seen={};

    this.onlyMe=!!s.onlyMe; this.reqs=s.reqs||[]; this.totals=s.totals!==false; this._remind=s.remind!==false;

  const now=(d=>d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+'00Z')(new Date());

    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(H||0)+p(M||0)+'00';};
  const end=(ds,hhmm,h)=>{const d=parseISO(ds),[H,M]=String(hhmm).split(':').map(Number);
    d.setHours(H||0,M||0,0,0); d.setMinutes(d.getMinutes()+Math.round(h*60));

  const L=['BEGIN:VCALENDAR','VERSION:2.0','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'PRODID:-//WE Middle Delta//Unified Shift Roster//AR',
    'X-WR-CALNAME:'+this.icsEsc(this.t('nightCalName')+' — '+this.cycleName()),
    'X-WR-TIMEZONE:Africa/Cairo'];
  days.forEach(d=>{
    L.push('BEGIN:VEVENT',
      'UID:we-'+PUB.cycle.id+'-'+id+'-'+d+'@middledelta.we','DTSTAMP:'+now,
      'DTSTART:'+loc(d,st),'DTEND:'+end(d,st,dur),

      'DESCRIPTION:'+this.icsEsc((this.lang==='en'?'Unified Shift Roster – Middle Delta Engineers':'الوردية الموحدة لمهندسين وسط الدلتا')
        +'\\n'+e.name+' · '+this.dept(e.dept)+'\\n\\nPowered By Eng. Ahmed Rozaiq'),
      'CATEGORIES:WE,NIGHT-SHIFT','STATUS:CONFIRMED','TRANSP:OPAQUE','SEQUENCE:0',
      'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT'+lead+'H','DESCRIPTION:'+this.icsEsc(this.t('nightAlarm')),'END:VALARM',
      'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT2H','DESCRIPTION:'+this.icsEsc(this.t('nightAlarm2')),'END:VALARM',
      'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const blob=new Blob(['\ufeff'+L.join('\r\n')],{type:'text/calendar;charset=utf-8'});
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download='WE-Night-'+String(e.name).replace(/\s+/g,'-')+'-'+PUB.cycle.start+'.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500);
  this.toast(this.t('icsReady',{n:days.length}),'ok');

/* =====================================================================
   SWAP REQUEST CODE  —  shared format with the administrator page
   WE-SWP1.<base64url(JSON)>.<checksum>
   The code carries a request only. It grants no authority: the
   administrator's page decodes it, shows BEFORE/AFTER and executes
   nothing until they press Confirm.
   ===================================================================== */
const SwapCode = {
  PREFIX:'WE-SWP1',
  _b64e(s){ const b=new TextEncoder().encode(s); let x=''; b.forEach(c=>x+=String.fromCharCode(c));
    return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  _b64d(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
    const bin=atob(s), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return new TextDecoder().decode(u); },
  _sum(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h*33)^s.charCodeAt(i))>>>0; }
    return h.toString(36).toUpperCase().padStart(7,'0').slice(-7); },
  encode(o){ const j=JSON.stringify(o), p=this._b64e(j); return this.PREFIX+'.'+p+'.'+this._sum(p); },
  decode(code){
    const raw=String(code||'').trim().replace(/\s+/g,'');
    const m=raw.match(/WE-SWP1\.([A-Za-z0-9\-_]+)\.([A-Z0-9]{7})/);
    if(!m) return {ok:false,err:'format'};
    if(this._sum(m[1])!==m[2]) return {ok:false,err:'checksum'};
    try{ const o=JSON.parse(this._b64d(m[1]));
      if(!o||o.v!==1||!o.d||!o.a||!o.b) return {ok:false,err:'payload'};
      return {ok:true,req:o}; }catch(e){ return {ok:false,err:'parse'}; }
  },
  findAll(text){ const out=[], re=/WE-SWP1\.[A-Za-z0-9\-_]+\.[A-Z0-9]{7}/g; let m;
    while((m=re.exec(String(text||'')))) out.push(m[0]); return out; },
  B36:'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  _e36(n,len){ let s=''; n=Math.max(0,Math.floor(n));
    while(n>0){ s=this.B36[n%36]+s; n=Math.floor(n/36); }
    while(s.length<len) s='0'+s; return s; },
  _ck(s){ let h=7; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%36; return this.B36[h]; },
  shortEncode(aNo,bNo,dayIdx){
    if(!(aNo>=0&&bNo>=0&&dayIdx>=0&&aNo<=255&&bNo<=255&&dayIdx<=63)) return null;
    const body=this._e36(aNo*16384+bNo*64+dayIdx,5);
    return body+this._ck(body);
  }
};

V.myReqs=function(){
  let b='';
  if(!this.reqs.length) b='<div class="empty-s">'+svg('list')+'<p>'+esc(this.t('noReq'))+'</p></div>';
  else b=this.reqs.map((r,i)=>'<div class="reqrow">'
    +'<span style="flex:1"><b>'+esc(this.fmtShort(r.date))+'</b> ↔ '+esc(r.other)
    +'<br><small style="color:var(--ink-3)">'+new Date(r.ts).toLocaleString(this.lang==='ar'?'ar-EG':'en-GB')+(r.note?' · '+esc(r.note):'')+'</small></span>'
    +'<span class="tag off">'+(r.av?SHIFT_LBL[r.av]:'—')+'</span>→<span class="tag info">'+(r.bv?SHIFT_LBL[r.bv]:'—')+'</span>'
    +'<span class="tag warn">'+esc(this.t('pending'))+'</span>'
    +'<button class="tbtn" onclick="V.reshow('+i+')">'+svg('copy',13)+'</button></div>').join('');
  this.modal({title:this.t('myRequests'),icon:'list',wide:true,
    body:'<div class="note i">'+svg('info')+'<div>'+esc(this.t('cannotEdit'))+'</div></div>'+b,
    footer:'<button class="btn btn-g" onclick="V.closeModal()">'+esc(this.t('close'))+'</button>'});
};
V.reshow=function(i){ const r=this.reqs[i]; const d=SwapCode.decode(r.code); if(d.ok) this.showCode(r.code,d.req); };

/* ---- boot ---- */
(function(){
  V.load();
  $('#logoImg').src=LOGO;
  V.applyTheme(); V.applyDensity(); V.applyLang();
  if(V.me) V.sel=V.me;
  V.renderAll();
  /* statistics stay closed until the engineer asks for them */
  setTimeout(()=>{ if(innerWidth>1100&&!sessionStorage.getItem('we_v_fit')){ sessionStorage.setItem('we_v_fit','1'); V.fit(); } },250);
  let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(V.fitOn){V.fitOn=false;V.fit();} else V.renderAll(); },220); });
  window.WEV={V,SwapCode,PUB,Chart};
  console.log('%cWE Engineer View (read-only)','color:#5B2C94;font-weight:800',
    '| published:',PUB.publishedAt,'|',PUB.engineers.length,'engineers |',V.dates().length,'days');
})();
</script>
