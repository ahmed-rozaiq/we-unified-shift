  save(id){
    if(!Auth.can()) return;
    const s=$('#cS').value, e=$('#cE').value; if(!s||!e||e<s) return;
    const nm=$('#cN').value.trim();
    if(!nm){ UI.toast(I18N.t('nameRequired'),'warn'); $('#cN').focus(); return; }
    Data.snap('cycle');
    if(id){ const c=Data.state.cycles.find(x=>x.id===id);
      Object.assign(c,{start:s,end:e,name:nm,nameEn:$('#cNe').value.trim()}); }
    else { const nc={id:uid('c'),start:s,end:e,name:nm,nameEn:$('#cNe').value.trim()};
      Data.state.cycles.push(nc); Data.state.assign[nc.id]={}; Data.state.activeCycle=nc.id; }
    Data.save(); UI.closeModal(); UI.refreshAll(); UI.toast(I18N.t('saved'),'ok');
  },
  open(id){ Data.snap('cycle'); Data.state.activeCycle=id; Data.state.selectedEng=null; Side.close();
    Data.save(); UI.refreshAll(); UI.go('roster'); UI.toast(I18N.t('open')+' ✓','ok'); },
  dup(id){ if(!Auth.can()) return; const c=Data.state.cycles.find(x=>x.id===id); Data.snap('cycle');
    const len=daysBetween(c.start,c.end);
    const ns=addDays(c.end,1), ne=addDays(ns,len-1);
    const nc={id:uid('c'),start:ns,end:ne,
      name:this.suggestName(ns,ne,'ar'), nameEn:this.suggestName(ns,ne,'en')};
    Data.state.cycles.push(nc); Data.state.assign[nc.id]={};
    Data.state.activeCycle=nc.id; Data.save(); UI.refreshAll(); UI.toast(I18N.t('saved'),'ok'); },
  del(id){ if(!Auth.can()) return; UI.confirm(I18N.t('del')+'؟',()=>{ Data.snap('cycle');
    Data.state.cycles=Data.state.cycles.filter(c=>c.id!==id); delete Data.state.assign[id];
    if(Data.state.activeCycle===id) Data.state.activeCycle=Data.state.cycles[0].id;
    Data.save(); UI.refreshAll(); UI.toast(I18N.t('deleted'),'ok'); }); }
};

const IO = {
  download(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); },

  pickFile(accept,cb){ const i=document.createElement('input'); i.type='file'; i.accept=accept;
    i.onchange=()=>{ if(i.files[0]) cb(i.files[0]); }; i.click(); },

  importExcel(){
    if(!Auth.can()) return;
    if(typeof XLSX==='undefined'){ UI.toast('XLSX library not loaded (offline?)','err'); return; }
    this.pickFile('.xls,.xlsx,.csv',f=>{
      const r=new FileReader();
      r.onload=ev=>{ try{
        const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
        this.mapDialog(rows, wb.SheetNames[0]);
      }catch(err){ UI.toast('Import error: '+err.message,'err'); } };
      r.readAsArrayBuffer(f);
    });
  },
  /* the roster title is the longest text cell in the first rows */
  detectTitle(rows){
    let best='';
    for(let r=0;r<Math.min(6,rows.length);r++){
      const row=rows[r]||[];
      for(let c=0;c<row.length;c++){
        const t=String(row[c]==null?'':row[c]).trim();
        if(t.length>best.length && t.length>=12 && !/^[\d\s\/\-\.]+$/.test(t)) best=t;
      }
    }
    return best;
  },
  /* "… من 29/7/2026 إلى 27/8/2026" → {start,end} */
  detectDates(txt){
    let s=String(txt||'');
    s=s.replace(/[\u0660-\u0669]/g,d=>String(d.charCodeAt(0)-0x0660))
       .replace(/[\u06F0-\u06F9]/g,d=>String(d.charCodeAt(0)-0x06F0));
    const out=[], re=/(\d{1,2})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{4})/g;
    let m; while((m=re.exec(s))) out.push(m);
    if(out.length<2) return null;
    const mk=f=>{ const d=+f[1], mo=+f[2], y=+f[3];
      if(mo<1||mo>12||d<1||d>31) return null;
      return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'); };
    const a=mk(out[0]), b=mk(out[1]);
    if(!a||!b||b<a) return null;
    return {start:a,end:b};
  },

  modeUI(){ const m=document.querySelector('input[name=imode]:checked').value;

  targetUI(){ const t=document.querySelector('input[name=itarget]:checked');
    const box=$('#newCycBox'); if(box) box.style.display=(t&&t.value==='cur')?'none':'block'; },
  normShift(v){ const s=String(v).trim().toLowerCase();
    if(!s) return null;
    if(/(اضح|أضح|adha)/.test(s)) return 'D';
    if(/(فطر|fitr)/.test(s)) return 'E';
    if(/(منزل|home|wfh|remote|ن)$/.test(s)||/(منزل|home|wfh|remote)/.test(s)) return 'W';
    if(/(اجاز|أجاز|رسمي|holiday|leave|off)/.test(s)) return 'R';
    if(/^(ص|s|m|morning|صباح)/.test(s)) return 'S';
    if(/^(ل|l|n|night|ليل)/.test(s)) return 'L';
    if(/^(c|on ?call|تحت)/.test(s)) return 'C';
    if(/^ر$/.test(s)) return 'R';
    if(/^ض$/.test(s)) return 'D';
    if(/^ف$/.test(s)) return 'E';
    return null; },
  ROWTYPE(v){ const s=String(v).trim();
    if(/ليل/.test(s)) return 'L'; if(/صباح/.test(s)) return 'S'; if(/on\s*call/i.test(s)) return 'C';
    if(/منزل/.test(s)) return 'W'; if(/اضح|أضح/.test(s)) return 'D'; if(/فطر/.test(s)) return 'E';
    if(/رسمي/.test(s)) return 'R'; return null; },
  ensureEng(name,dept){
    name=String(name).trim().replace(/\u0640/g,'').replace(/\s+/g,' '); if(!name) return null;
    const k=normName(name), kt=k.split(' ');
    let e=Data.state.engineers.find(x=>normName(x.name)===k);
    if(!e){
      /* An engineer already renamed to a full name ("مصطفى حمادة") must still match
         the short name in the source file ("مصطفى"). Only link when exactly one
         candidate matches by word-prefix inside the same department. */
      const cand=Data.state.engineers.filter(x=>{
        if(dept && x.dept && x.dept!==dept) return false;
        const xt=normName(x.name).split(' ');
        const n=Math.min(xt.length,kt.length);
        return xt.length!==kt.length && xt.slice(0,n).join(' ')===kt.slice(0,n).join(' ');
      });
      if(cand.length===1) e=cand[0];
    }
    if(e && name.split(' ').length>e.name.trim().split(/\s+/).length) e.name=name; // prefer fuller spelling
    if(!e){ e={id:uid('e'),name,dept:dept||Data.state.depts[0]||'—',email:'',lang:'ar',active:true};
      Data.state.engineers.push(e); if(dept&&!Data.state.depts.includes(dept)) Data.state.depts.push(dept); }
    return e; },
  doImport(){
    if(!Auth.can()) return;
    const mode=document.querySelector('input[name=imode]:checked').value;
    const tgtEl=document.querySelector('input[name=itarget]:checked');
    const target=tgtEl?tgtEl.value:'cur';
    const rows=this._rows||[];
    Data.snap('import');
    let start, createdName=null;
    if(target==='new'){
      const nm=(($('#mName')&&$('#mName').value)||'').trim();
      if(!nm){ UI.toast(I18N.t('nameRequired'),'warn'); if($('#mName'))$('#mName').focus(); Data._undo.pop(); return; }
      const s0=($('#mStart')&&$('#mStart').value)||Data.cycle().start;
      let e0=($('#mEnd')&&$('#mEnd').value)||addDays(s0,29);
      if(e0<s0) e0=addDays(s0,29);
      const nc={id:uid('c'),start:s0,end:e0,name:nm,nameEn:nm};
      Data.state.cycles.push(nc); Data.state.assign[nc.id]={}; Data.state.activeCycle=nc.id;
      start=s0; createdName=nm;
    } else {
      start=($('#mStart')&&$('#mStart').value)||Data.cycle().start;
    }
    let n=0; const A=Data.A();
    if(mode==='matrix'){
      let dept=null, dayCols=null;
      rows.forEach(r=>{
        const typ=this.ROWTYPE(r[2]!==undefined?r[2]:'');
        // detect day-number header row
        if(!typ){ const nums=r.map((c,i)=>({i,n:parseInt(c,10)})).filter(o=>!isNaN(o.n)&&o.n>=1&&o.n<=31);
          if(nums.length>=20){ dayCols=nums.map(o=>o.i); } return; }
        if(String(r[1]||'').trim()) dept=String(r[1]).trim();
        const cols = dayCols || r.map((c,i)=>i).slice(3,33);
        cols.forEach((ci,k)=>{
          const nm=String(r[ci]||'').trim().replace(/\u0640/g,'').replace(/\s+/g,' '); if(!nm||/^\d+$/.test(nm)) return;
          const e=this.ensureEng(nm,dept); if(!e) return;
          const d=addDays(start,k); if(!A[e.id])A[e.id]={};
          const PR={L:7,C:6,W:5,S:4,D:3,E:2,R:1};
          const cur=A[e.id][d];
          if(!cur || (PR[typ]||0) > (PR[cur]||0)) { A[e.id][d]=typ; }
          n++;
        });
      });
    } else {
      const ce=+$('#mEng').value, cm=$('#mMail').value===''?-1:+$('#mMail').value, cd=+$('#mDate').value, cs=+$('#mShift').value;
      rows.forEach(r=>{
        const nm=String(r[ce]||'').trim(); if(!nm) return;
        const sh=this.normShift(r[cs]); if(!sh) return;
        let d=String(r[cd]||'').trim(); if(!d) return;
        let ds=null;
        if(/^\d{4}-\d{2}-\d{2}/.test(d)) ds=d.slice(0,10);
        else { const p=new Date(d); if(!isNaN(p)) ds=iso(p); else { const num=parseInt(d,10); if(!isNaN(num)&&num<=31) ds=addDays(start,num-1); } }
        if(!ds) return;
        const e=this.ensureEng(nm); if(cm>=0 && r[cm] && !e.email) e.email=String(r[cm]).trim();
        if(!A[e.id])A[e.id]={}; A[e.id][ds]=sh; n++;
      });
    }
    Data.state.history.push({id:uid('h'),ts:Date.now(),type:'import',note:mode+' — '+n+(createdName?' · '+createdName:'')});
    Data.saveNow(); UI.closeModal(); UI.refreshAll();
    if(createdName) UI.toast(I18N.t('cycleCreated',{n:createdName}),'ok');
    UI.toast(I18N.t('imported',{n}),'ok',true);
  },

        'WE-Roster-Engineers-'+snap.cycle.start+'_'+snap.cycle.end+'.html');

/* =====================================================================
   REQUESTS INBOX  —  decode, verify, then the ADMIN executes
   ===================================================================== */
const Requests = {
  paste(){
    UI.modal({title:I18N.t('pasteCode'),icon:'inbox',wide:true,
      body:'<div class="note i">'+svg('info')+'<div>'+esc(I18N.t('pasteHint'))+'</div></div>'
        +'<div class="fld"><label>'+esc(I18N.t('reqCode'))+'</label>'
        +'<textarea id="reqPaste" rows="5" dir="ltr" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:3px;text-align:center" '
        +'placeholder="K7M2Q4"></textarea>'
        +'<div class="hint">'+esc(I18N.t('pasteMulti'))+'</div></div>',
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('cancel'))+'</button>'
        +'<button class="btn btn-p" onclick="Requests.ingest()">'+svg('down',14)+esc(I18N.t('readCode'))+'</button>'});
  },
  /* rebuild the full request from a 6-character code using our own roster */
  fromShort(code){
    const d=SwapCode.shortDecode(code); if(!d) return null;
    const A=Data.engByNo(d.a), B=Data.engByNo(d.b);
    const ds=Data.dates(); const day=ds[d.d];
    if(!A||!B||!day||A.id===B.id) return null;
    const c=Data.cycle();
    return {v:1,t:'swap',c:c.id,cs:c.start,ce:c.end,d:day,
      a:A.id,an:A.name,b:B.id,bn:B.name,
      av:Data.get(A.id,day)||null, bv:Data.get(B.id,day)||null,
      n:'', ts:Date.now(), short:code};
  },
  ingest(){
    if(!Auth.can()) return;
    const txt=$('#reqPaste').value||'';
    const long=SwapCode.findAll(txt), short=SwapCode.findShort(txt);
    const codes=long.concat(short);
    if(!codes.length){ UI.toast(I18N.t('codeInvalid'),'err'); return; }
    let added=0, dupes=0, bad=0;
    codes.forEach(code=>{
      let req=null;
      if(code.length===6){ req=this.fromShort(code); }
      else { const r=SwapCode.decode(code); req=r.ok?r.req:null; }
      if(!req){ bad++; return; }
      if(Data.state.requests.some(x=>x.code===code)){ dupes++; return; }
      Data.state.requests.push({id:uid('r'),code,req,status:'new',received:Date.now()});
      added++;
    });
    Data.save(); UI.closeModal(); UI.refreshAll();
    UI.toast(I18N.t('reqAdded',{n:added})+(dupes?' · '+I18N.t('reqDup',{n:dupes}):'')+(bad?' · '+bad+' ✕':''), added?'ok':'warn');
    if(added) UI.go('requests');
  },
  validate(r){
    const p=r.req, out={errs:[],warns:[]};
    const A=Data.eng(p.a), B=Data.eng(p.b);
    if(!A) out.errs.push(I18N.t('reqEngGone')+': '+p.an);
    if(!B) out.errs.push(I18N.t('reqEngGone')+': '+p.bn);
    if(p.c!==Data.state.activeCycle){
      const own=Data.state.cycles.find(c=>c.id===p.c);
      out.warns.push(I18N.t('reqOtherCycle')+(own?' ('+Data.cycleName(own)+')':''));
    }
    if(!Data.dates().includes(p.d)) out.errs.push(I18N.t('reqDateOut')+': '+fmtDate(p.d));
    if(A&&B){
      const nowA=Data.get(p.a,p.d), nowB=Data.get(p.b,p.d);
      if(nowA!==(p.av||null)||nowB!==(p.bv||null)) out.warns.push(I18N.t('reqStale'));
      out.nowA=nowA; out.nowB=nowB;
    }
    return out;
  },
  approve(id){
    if(!Auth.can()) return;
    const r=Data.state.requests.find(x=>x.id===id); if(!r) return;
    const v=this.validate(r); if(v.errs.length){ UI.toast(v.errs[0],'err'); return; }
    const p=r.req, A=Data.eng(p.a), B=Data.eng(p.b);
    const nowA=Data.get(p.a,p.d), nowB=Data.get(p.b,p.d);
    const badge=x=>x?'<span class="tag" style="background:var(--shift-'+x+'-bg);color:var(--shift-'+x+');border:1px solid var(--shift-'+x+'-bd);font-size:12px;padding:3px 10px">'+ST[x].lbl+' '+esc(shiftName(x))+'</span>':'<span class="tag off">—</span>';
    UI.modal({title:I18N.t('confirmSwap'),icon:'swaps',wide:true,
      body:(v.warns.length?v.warns.map(w=>'<div class="note w">'+svg('warn')+'<div>'+esc(w)+'</div></div>').join(''):'')
        +'<div class="note i">'+svg('info')+'<div><b>'+esc(I18N.t('reqFrom'))+': '+esc(p.an)+'</b> · '+esc(dowName(p.d))+' '+esc(fmtDate(p.d))
        +(p.n?'<br>'+esc(I18N.t('reason'))+': '+esc(p.n):'')+'</div></div>'
        +'<div class="swapviz">'
        +'<div class="swapcol"><div class="h">'+esc(I18N.t('before'))+'</div>'
          +'<div class="swaprow"><span class="nm2">'+esc(A.name)+'</span>'+badge(nowA)+'</div>'
          +'<div class="swaprow"><span class="nm2">'+esc(B.name)+'</span>'+badge(nowB)+'</div></div>'
        +'<div class="swaparrow">'+svg('swaps',24)+'</div>'
        +'<div class="swapcol after"><div class="h">'+esc(I18N.t('after'))+'</div>'
          +'<div class="swaprow"><span class="nm2">'+esc(A.name)+'</span>'+badge(nowB)+'</div>'
          +'<div class="swaprow"><span class="nm2">'+esc(B.name)+'</span>'+badge(nowA)+'</div></div></div>'
        +'<div class="fld" style="margin-top:14px"><label>'+esc(I18N.t('reason'))+'</label>'
        +'<input id="reqNote2" value="'+esc(p.n||'')+'"></div>'
        +'<div class="note i">'+svg('warn')+'<div>'+esc(I18N.t('adminDecides'))+'</div></div>',
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('cancel'))+'</button>'
        +'<button class="btn btn-p" onclick="Requests.execute(\''+id+'\')">'+svg('check',14)+esc(I18N.t('confirmSwap'))+'</button>'});
  },
  execute(id){
    if(!Auth.can()) return;
    const r=Data.state.requests.find(x=>x.id===id); if(!r) return;
    const p=r.req;
    Swap.a=p.a; Swap.b=p.b; Swap.date=p.d;
    const note=(($('#reqNote2')&&$('#reqNote2').value)||p.n||'').trim();
    const av=Data.get(p.a,p.d), bv=Data.get(p.b,p.d);
    Data.snap('request');
    Data.set(p.a,p.d,bv,{noSnap:true}); Data.set(p.b,p.d,av,{noSnap:true});
    const rec={id:uid('s'),ts:Date.now(),cycle:Data.state.activeCycle,date:p.d,
      a:p.a,b:p.b,aOld:av,aNew:bv,bOld:bv,bNew:av,note:note,via:'request'};
    Data.state.swaps.push(rec);
    Data.state.history.push({id:uid('h'),ts:Date.now(),type:'request-approved',eng:p.a,date:p.d,from:av,to:bv,note:note||('from '+p.an)});
    if(Data.state.settings.notifyOnSwap) Notify.queueSwap(rec);
    r.status='approved'; r.decided=Date.now();
    Data.save(); UI.closeModal(); UI.refreshAll(); UI.syncUndo();
    UI.toast(I18N.t('swapDone'),'ok',true);
  },
  reject(id){
    if(!Auth.can()) return;
    const r=Data.state.requests.find(x=>x.id===id); if(!r) return;
    UI.confirm(I18N.t('rejectConfirm'),()=>{ r.status='rejected'; r.decided=Date.now();
      Data.state.history.push({id:uid('h'),ts:Date.now(),type:'request-rejected',eng:r.req.a,date:r.req.d,note:r.req.an});
      Data.save(); UI.refreshAll(); UI.toast(I18N.t('rejected'),'ok'); });
  },
  del(id){ Data.state.requests=Data.state.requests.filter(x=>x.id!==id); Data.save(); UI.refreshAll(); },
  clearDone(){ Data.state.requests=Data.state.requests.filter(x=>x.status==='new'); Data.save(); UI.refreshAll(); },
  render(){
    const rs=Data.state.requests.slice().reverse();
    const pend=rs.filter(r=>r.status==='new');
    let h='';
    h+='<div class="panel"><div class="panel-hd"><div class="ic">'+svg('inbox')+'</div>'
      +'<h3>'+esc(I18N.t('nav_requests'))+'</h3>'
      +'<span class="tag '+(pend.length?'warn':'ok')+'">'+esc(I18N.t('pendingReq'))+': '+pend.length+'</span>'
      +'<button class="btn btn-g" onclick="Requests.clearDone()">'+esc(I18N.t('clearDone'))+'</button>'
      +'<button class="btn btn-p" onclick="Requests.paste()">'+svg('down',14)+esc(I18N.t('pasteCode'))+'</button></div><div class="panel-bd">'
      +'<div class="note i">'+svg('lock')+'<div>'+esc(I18N.t('reqFlow'))+'</div></div>';
    if(!rs.length) h+='<div class="empty-s">'+svg('inbox')+'<p>'+esc(I18N.t('noRequests'))+'</p></div>';
    rs.forEach(r=>{
      const p=r.req, v=this.validate(r);
      const st=r.status==='new'?'warn':r.status==='approved'?'ok':'off';
      const lbl=r.status==='new'?I18N.t('pendingApproval'):r.status==='approved'?I18N.t('approved'):I18N.t('rejected');
      h+='<div class="card" style="margin-bottom:10px;border-color:'+(r.status==='new'?'var(--we-violet)':'var(--line)')+'">'
        +'<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px">'
        +'<span class="tag '+st+'">'+esc(lbl)+'</span>'
        +'<b style="font-size:13px">'+esc(p.an)+'</b><span style="color:var(--ink-3)">⇄</span><b style="font-size:13px">'+esc(p.bn)+'</b>'
        +'<span class="tag info">'+esc(dowName(p.d))+' '+esc(fmtDate(p.d))+'</span>'
        +'<span style="flex:1"></span>'
        +'<span style="font-size:10.5px;color:var(--ink-3)">'+new Date(r.received).toLocaleString(I18N.lang==='ar'?'ar-EG':'en-GB')+'</span></div>'
        + (p.n?'<div style="font-size:11.5px;color:var(--ink-2);margin-bottom:8px">'+esc(I18N.t('reason'))+': '+esc(p.n)+'</div>':'')
        + v.errs.map(e=>'<div class="note e" style="padding:8px 11px;margin-bottom:6px">'+svg('warn')+'<div>'+esc(e)+'</div></div>').join('')
        + v.warns.map(e=>'<div class="note w" style="padding:8px 11px;margin-bottom:6px">'+svg('warn')+'<div>'+esc(e)+'</div></div>').join('')
        +'<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px">'
        +'<span>'+esc(p.an)+': '+(p.av?'<span class="tag" style="background:var(--shift-'+p.av+'-bg);color:var(--shift-'+p.av+')">'+ST[p.av].lbl+'</span>':'<span class="tag off">—</span>')
        +' → '+(p.bv?'<span class="tag" style="background:var(--shift-'+p.bv+'-bg);color:var(--shift-'+p.bv+')">'+ST[p.bv].lbl+'</span>':'<span class="tag off">—</span>')+'</span>'
        +'<span style="color:var(--ink-3)">|</span>'
        +'<span>'+esc(p.bn)+': '+(p.bv?'<span class="tag" style="background:var(--shift-'+p.bv+'-bg);color:var(--shift-'+p.bv+')">'+ST[p.bv].lbl+'</span>':'<span class="tag off">—</span>')

      else h+='<button class="tbtn danger" onclick="Requests.del(\''+r.id+'\')">'+svg('trash',13)+'</button>';
      h+='</div></div>';

    h+='</div></div>';

const Auth = {
  KEY:'we_mdelta_role_v1',
  role:null,      // 'engineer' | 'committee'
  user:null,      // engineer id  |  committee id
  tries:0,
  isAdmin(){ return this.role==='committee'; },
  list(){ return COMMITTEE_LIST(); },
  member(){ return this.list().find(c=>c.id===this.user)||null; },
  isOwner(){ const m=this.member(); return !!(m&&(m.owner||m.role==='admin')); },
  canManage(silent){ if(this.isAdmin()&&this.isOwner()) return true;
    if(!silent) UI.toast(I18N.t('ownerOnly'),'err'); return false; },
  meEng(){ return this.role==='engineer' ? Data.eng(this.user) : null; },
  displayName(){
    if(this.role==='committee'){ const m=this.member(); return m?(I18N.lang==='en'?m.nameEn:m.name):'—'; }
    const e=this.meEng(); return e?e.name:'—';
  },
  /* the single enforcement point for every mutating action */
  can(silent){
    if(this.isAdmin()) return true;
    if(!silent) UI.toast(I18N.t('noPermission'),'err');
    return false;
  },
  save(){ try{ localStorage.setItem(this.KEY,JSON.stringify({role:this.role,user:this.user})); }catch(e){} },
  load(){ try{ const s=JSON.parse(localStorage.getItem(this.KEY)||'null');
    if(s&&s.role){ if(s.role==='committee'&&this.list().some(c=>c.id===s.user&&c.active!==false)){ this.role='committee'; this.user=s.user; }
      else if(s.role==='engineer'&&Data.eng(s.user)){ this.role='engineer'; this.user=s.user; } } }catch(e){} },
  logout(){ this.role=null; this.user=null; try{ localStorage.removeItem(this.KEY); }catch(e){}
    Data.state.selectedEng=null; Side.close(); this.gate(); },

    }
    else if(step==='pin'){
      h+='<div class="gate-q">'+esc(I18N.t('enterPin'))+'</div>'
        +'<div class="gate-members">'+this.list().filter(c=>c.active!==false).map(c=>'<span class="gmem'+(c.owner?' own':'')+'">'
          +svg(c.owner?'crown':'shield',13)+esc(I18N.lang==='en'?c.nameEn:c.name)+'</span>').join('')+'</div>'
        +'<div class="pinbox"><input id="gPin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" '
        +'placeholder="••••••" oninput="Auth.pinType()" onkeydown="if(event.key===\'Enter\')Auth.tryPin()" autofocus></div>'
        +'<div id="pinMsg" class="pinmsg"></div>'
        +'<button class="btn btn-p" style="width:100%;margin-top:6px" onclick="Auth.tryPin()">'+svg('check',15)+esc(I18N.t('enter'))+'</button>'
        +'<button class="gate-back" onclick="Auth.gate(\'role\')">'+svg('chev',14)+esc(I18N.t('back'))+'</button>'
        +'<div class="gate-note">'+svg('info',13)+'<span>'+esc(I18N.t('pinNotSecurity'))+'</span></div>';
    }
    h+='</div><div class="gate-ft"><span class="cl">'+esc(I18N.t('poweredBy'))+'</span>'
      +'<span class="sig" title="Eng. Ahmed Rozaiq"><span class="sig-t gtext">Eng. Ahmed Rozaiq</span><span class="sig-dot"></span></span></div></div></div>';
    wrap.innerHTML=h;
    setTimeout(()=>{ const f=step==='pin'?$('#gPin'):(step==='engineer'?$('#gSearch'):null); if(f&&f.focus) f.focus(); },80);
  },
  gateLang(l){ I18N.lang=l; Data.state.lang=l; Data.save();
    document.documentElement.lang=l; document.documentElement.dir=T[l].dir;
    const cur=$('#gPin')?'pin':($('#gList')?'engineer':'role'); this.gate(cur); },
  engList(q){
    q=(q||'').toLowerCase();
    let h='';
    Data.state.depts.forEach(dp=>{
      const list=Data.engs(true).filter(e=>e.dept===dp&&(!q||e.name.toLowerCase().includes(q)));
      if(!list.length) return;
      const c=deptColor(dp);
      h+='<div class="gsec"><span class="dbar" style="background:'+c.fg+'"></span>'+esc(I18N.t('deptOf'))+' '+esc(I18N.dept(dp))+'</div>';
      h+=list.map(e=>'<button class="gitem" onclick="Auth.asEngineer(\''+e.id+'\')">'
        +'<span class="av">'+esc(initials(e.name))+'</span><b>'+esc(e.name)+'</b>'
        +deptChip(e.dept)+svg('chev',14)+'</button>').join('');
      h+='</div>';
    });
    return h||'<div class="empty-s"><p>'+esc(I18N.t('noData'))+'</p></div>';
  },
  filterEngs(q){ $('#gList').innerHTML=this.engList(q); },
  asEngineer(id){
    if(!Data.eng(id)) return;
    this.role='engineer'; this.user=id; this.tries=0; this.save();
    $('#gate').classList.remove('on');
    /* the roster is what they came for — statistics stay closed until asked */
    Data.state.selectedEng=null; Data.state.view='roster'; Data.save();
    Side.close(); UI.applyRole(); UI.refreshAll();
    UI.toast(I18N.t('welcome')+' '+Data.eng(id).name+' — '+I18N.t('statsOnTap'),'ok');
  },
  pinType(){ const m=$('#pinMsg'); if(m) m.innerHTML=''; },
  tryPin(){
    const v=($('#gPin').value||'').trim();
    const hit=this.list().find(c=>c.h===pinHash(v)&&c.active!==false);
    if(!hit){
      this.tries++;
      $('#pinMsg').innerHTML='<span class="bad">'+svg('x',13)+esc(I18N.t('wrongPin'))
        +(this.tries>2?' ('+this.tries+')':'')+'</span>';
      $('#gPin').value='';
      return;
    }
    this.role='committee'; this.user=hit.id; this.tries=0; this.save();
    $('#gate').classList.remove('on');
    UI.applyRole(); UI.refreshAll();
    UI.toast(I18N.t('welcome')+' '+(I18N.lang==='en'?hit.nameEn:hit.name),'ok');
  }
};

    if(hint){ hint.style.display=adm?'none':'';
      hint.innerHTML=adm?'':svg('lock',13)+'<span>'+esc(I18N.t('engHintFull'))+'</span>'; }
  },
  toggleOnlyMe(){ this.onlyMe=!this.onlyMe; this.apply(); Roster.render(); },
  /* one obvious way in — works the same on phone and desktop */
  openMine(){ const me=Auth.meEng(); if(!me) return; Side.open(me.id); },
  /* the engineer's only reminder control: on or off */
  remindOn(id){ const m=Data.state.engRemind||{}; return m[id]!==false; },
  toggleRemind(id){
    if(!Data.state.engRemind) Data.state.engRemind={};
    const now=!this.remindOn(id);
    Data.state.engRemind[id]=now; Data.saveNow();
    if(Data.state.selectedEng===id) Side.open(id,true);
    UI.toast(I18N.t(now?'reminderOnMsg':'reminderOffMsg'),'ok');
  },

  /* --- swap request from the engineer --- */
  req:{date:null,other:null,note:''},
  reqOpen(pre){
    const me=Auth.meEng(); if(!me){ UI.toast(I18N.t('noPermission'),'warn'); return; }
    const ds=Data.dates();
    const mine=ds.filter(d=>Data.get(me.id,d));
    this.req.date=this.req.date&&ds.includes(this.req.date)?this.req.date:(mine[0]||ds[0]);
    if(pre&&pre!==me.id) this.req.other=pre;
    if(!this.req.other||this.req.other===me.id)
      this.req.other=(Data.engs(true).find(e=>e.id!==me.id)||{}).id||null;
    this.reqDraw();
  },
  reqDraw(){
    const me=Auth.meEng(), ds=Data.dates(), other=this.req.other?Data.eng(this.req.other):null;
    const mv=Data.get(me.id,this.req.date), ov=other?Data.get(other.id,this.req.date):null;
    const badge=v=>v?'<span class="tag" style="background:var(--shift-'+v+'-bg);color:var(--shift-'+v+');border:1px solid var(--shift-'+v+'-bd);font-size:12px;padding:3px 10px">'+ST[v].lbl+' '+esc(shiftName(v))+'</span>'
      :'<span class="tag off">—</span>';
    const dOpt=ds.map(d=>{const v=Data.get(me.id,d);
      return '<option value="'+d+'"'+(d===this.req.date?' selected':'')+'>'+esc(dowName(d))+' — '+esc(fmtDate(d))+(v?'  ['+ST[v].lbl+']':'')+'</option>';}).join('');
    const eOpt=Data.state.depts.map(dp=>'<optgroup label="'+esc(I18N.dept(dp))+'">'
      +Data.engs(true).filter(e=>e.dept===dp&&e.id!==me.id).map(e=>{const v=Data.get(e.id,this.req.date);
        return '<option value="'+e.id+'"'+(e.id===this.req.other?' selected':'')+'>'+esc(e.name)+(v?'  ['+ST[v].lbl+']':'  [—]')+'</option>';}).join('')
      +'</optgroup>').join('');
    const same=mv===ov;
    UI.modal({title:I18N.t('reqSwapEng'),icon:'swaps',wide:true,
      body:'<div class="note i">'+svg('lock')+'<div>'+esc(I18N.t('engHint'))+'</div></div>'
        +'<div class="grid2"><div class="fld"><label>'+esc(I18N.t('date'))+'</label>'
        +'<select onchange="EngMode.req.date=this.value;EngMode.reqDraw()">'+dOpt+'</select></div>'
        +'<div class="fld"><label>'+esc(I18N.t('engB'))+'</label>'
        +'<select onchange="EngMode.req.other=this.value;EngMode.reqDraw()">'+eOpt+'</select></div></div>'
        +(same?'<div class="note w">'+svg('warn')+'<div>'+esc(I18N.t('noChange'))+'</div></div>':'')
        +'<div class="swapviz">'
        +'<div class="swapcol"><div class="h">'+esc(I18N.t('before'))+'</div>'
          +'<div class="swaprow"><span class="nm2">'+esc(me.name)+'</span>'+badge(mv)+'</div>'
          +'<div class="swaprow"><span class="nm2">'+esc(other?other.name:'—')+'</span>'+badge(ov)+'</div></div>'
        +'<div class="swaparrow">'+svg('swaps',24)+'</div>'
        +'<div class="swapcol after"><div class="h">'+esc(I18N.t('after'))+'</div>'
          +'<div class="swaprow"><span class="nm2">'+esc(me.name)+'</span>'+badge(ov)+'</div>'
          +'<div class="swaprow"><span class="nm2">'+esc(other?other.name:'—')+'</span>'+badge(mv)+'</div></div></div>'
        +'<div class="fld" style="margin-top:14px"><label>'+esc(I18N.t('reason'))+'</label>'
        +'<input id="emReqNote" value="'+esc(this.req.note||'')+'" oninput="EngMode.req.note=this.value" placeholder="—"></div>',
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('cancel'))+'</button>'
        +'<button class="btn btn-p" '+(same||!other?'disabled':'')+' onclick="EngMode.reqSend()">'+svg('check',14)+esc(I18N.t('sendToCommittee'))+'</button>'});
  },
  reqSend(){
    const me=Auth.meEng(), other=Data.eng(this.req.other);
    if(!me||!other||me.id===other.id) return;
    const c=Data.cycle();
    const mv=Data.get(me.id,this.req.date), ov=Data.get(other.id,this.req.date);
    const p={v:1,t:'swap',c:c.id,cs:c.start,ce:c.end,d:this.req.date,
      a:me.id,an:me.name,b:other.id,bn:other.name,av:mv||null,bv:ov||null,
      n:(this.req.note||'').slice(0,140),ts:Date.now()};
    const dayIdx=Data.dates().indexOf(this.req.date);
    const code=SwapCode.shortEncode(me.no,other.no,dayIdx) || SwapCode.encode(p);
    p.short=code;
    /* the engineer never writes to the roster — the request is only queued
       for the committee, exactly like a pasted code */
    Data.state.requests.push({id:uid('r'),code,req:p,status:'new',received:Date.now(),from:'inapp'});
    Data.saveNow();
    const msg=Send.swapMsg(p,me);
    Send._last={msg,code};
    UI.modal({title:I18N.t('sendToCommittee'),icon:'send',wide:true,
      body:'<div class="note s">'+svg('check')+'<div>'+esc(I18N.t('sendHint'))+'</div></div>'
        +'<div class="codebox"><div class="lbl">'+esc(I18N.t('reqCodeShort'))+'</div>'
        +'<div class="bigcode" onclick="Send.copy(\''+code+'\')">'+esc(code)+'</div>'
        +'<div class="lbl" style="margin:8px 0 0;opacity:.75">'+esc(I18N.t('reqCodeShortHint'))+'</div></div>'
        +'<div class="fld" style="margin-top:14px"><label>'+esc(I18N.t('preview'))+'</label>'
        +'<textarea readonly rows="7" style="line-height:1.75">'+esc(msg)+'</textarea></div>'
        +'<div class="share" style="display:flex;gap:9px;flex-wrap:wrap">'
        +COMMITTEE_LIST().filter(c=>c.active!==false).map(cm=>{
          const ce=Data.state.engineers.find(e=>normName(e.name)===normName(cm.roster||''));
          const ph=(cm.phone||(ce&&ce.phone)||'');

            +'<div style="font-size:12.5px;font-weight:800;margin-bottom:8px">'+svg(cm.owner?'crown':'shield',13)+' '+esc(I18N.lang==='en'?(cm.nameEn||cm.name):cm.name)+'</div>'
            +'<div style="display:flex;gap:7px;flex-wrap:wrap">'
            /* never disabled: with no number WhatsApp opens on its share sheet */
            +'<button class="btn btn-p wa" style="flex:1" title="'+esc(ph?I18N.t('whatsapp'):I18N.t('waNoNumber'))+'" onclick="Send.wa(\''+ph+'\')">'
              +svg('wa',14)+esc(ph?I18N.t('whatsapp'):I18N.t('waPick'))+'</button>'
            +'<button class="btn btn-g" style="flex:1" onclick="Send.mail(\''+em+'\',I18N.t(\'reqSwapEng\'))">'+svg('mail',14)+esc(I18N.t('emailCh'))+'</button>'
            +'</div>'
            +(ph?'':'<div class="hint" style="margin-top:6px">'+esc(I18N.t('waNoNumber'))+'</div>')
            +'</div>'; }).join('')
        +'</div>',
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('close'))+'</button>'
        +'<button class="btn btn-p" onclick="Send.copy()">'+svg('copy',14)+esc(I18N.t('copyMsg'))+'</button>'});
  }
};

   client with the message prepared, and the human presses Send.

const Send = {
  channel:'wa', kind:'personal', dept:'', picked:{}, _last:null,

  /* --- WhatsApp group ---------------------------------------------
     WhatsApp gives no API for a website to post into a group. The
     honest flow: open WhatsApp with the message ready and let the
     committee member pick the group and press send. --------------- */
  groupMsg(){
    const e={lang:I18N.lang};
    return this.kind==='personal' ? this.summary(e) : this.summary(e);
  },
  groupOpen(){
    const t=this.groupMsg(); this._last={msg:t};
    window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
    Data.state.history.push({id:uid('h'),ts:Date.now(),type:'send',note:'wa-group'});
    Data.save();
  },
  groupLink(){
    const g=(Data.state.waGroup||'').trim();
    if(!g){ UI.toast(I18N.t('waGroupHint'),'warn'); return; }
    window.open(g,'_blank');
  },
  groupDialog(){
    if(!Auth.can()) return;
    const g=Data.state.waGroup||'';
    const msg=this.groupMsg();
    this._last={msg};
    UI.modal({title:I18N.t('sendToGroup'),icon:'wa',wide:true,
      body:'<div class="note w">'+svg('warn')+'<div>'+esc(I18N.t('groupHint'))+'</div></div>'
        +'<div class="fld"><label>'+esc(I18N.t('waGroup'))+'</label>'
        +'<input id="waG" dir="ltr" value="'+esc(g)+'" placeholder="https://chat.whatsapp.com/..." '

        +'<div class="hint">'+esc(I18N.t('waGroupHint'))+'</div></div>'

  L(e){ return (e&&e.lang==='en')?'en':'ar'; },
  S(e,k,v){ const L=this.L(e); let s=(T[L]&&T[L][k])||T.ar[k]||k;
    if(v) for(const p in v) s=s.replace('{'+p+'}',v[p]); return s; },
  dateFor(e,d){ const L=this.L(e), x=parseISO(d);
    return T[L][DOWK[x.getDay()]]+' '+x.getDate()+' '+T[L]['m'+x.getMonth()]+' '+x.getFullYear(); },
  cycTxt(e){ const L=this.L(e), c=Data.cycle();
    return (L==='en'?(c.nameEn||c.name):c.name); },
  head(e){ const L=this.L(e);
    return (L==='ar'?'الوردية الموحدة لمهندسين وسط الدلتا':'Unified Shift Roster – Middle Delta Engineers')
      +'\n'+(L==='ar'?'الدورة: ':'Cycle: ')+this.cycTxt(e)
      +'\n'+fmtShort(Data.cycle().start)+' → '+fmtShort(Data.cycle().end)+'  ('+Data.dates().length+' '+(L==='ar'?'يوم':'days')+')'; },
  foot(e){ const L=this.L(e);
    return '\n'+(L==='ar'?'نظام الوردية الموحدة – WE':'WE Unified Shift Management System')
      +'\nPowered By Eng. Ahmed Rozaiq'; },

  personal(e){
    const L=this.L(e), st=Data.stats(e.id);
    let s=this.head(e)+'\n\n'+(L==='ar'?'م. ':'Eng. ')+e.name+' — '
      +(L==='ar'?'إدارة ':'Dept. ')+(L==='en'?(DEPT_EN[e.dept]||e.dept):e.dept)+'\n';
    if(!st.total) return s+'\n'+this.S(e,'noShiftsMsg')+this.foot(e);
    s+='\n'+this.S(e,'yourShifts')+':\n';
    Data.dates().forEach(d=>{ const v=Data.get(e.id,d); if(!v) return;
      const t=ST[v], nm=(L==='en'?t.en:t.ar), hh=shiftHours(v);
      s+='• '+this.dateFor(e,d)+'  —  '+t.lbl+' ('+nm+(hh?', '+hh+(L==='ar'?' س':'h'):'')+')\n'; });
    s+='\n'+(L==='ar'?'الإجمالي':'Total')+':  '
      +SK.filter(k=>st[k]).map(k=>ST[k].lbl+' '+st[k]).join(' · ')
      +'  =  '+st.total+' '+(L==='ar'?'وردية':'shifts')
      +(st.leave?'  +  '+st.leave+' '+(L==='ar'?'إجازة':'leave'):'')
      +'\n'+(L==='ar'?'إجمالي الساعات':'Total hours')+':  '+st.hours+' '+(L==='ar'?'ساعة':'hours');
    return s+this.foot(e);
  },
  summary(e){
    const L=this.L(e), ds=Data.dates();
    let s=this.head(e)+'\n';
    Data.state.depts.forEach(dp=>{
      const list=Data.engs(true).filter(x=>x.dept===dp); if(!list.length) return;
      s+='\n▸ '+(L==='ar'?'إدارة ':'Dept. ')+(L==='en'?(DEPT_EN[dp]||dp):dp)+'\n';
      list.forEach(x=>{ const st=Data.stats(x.id);
        const nights=st.days.L.map(d=>parseISO(d).getDate()).join(', ');
        s+='  '+x.name+' — '+SK.filter(k=>st[k]).map(k=>ST[k].lbl+st[k]).join(' ')+'  ('+st.hours+(L==='ar'?'س':'h')+')'
          +(nights?'\n     '+(L==='ar'?'ليالي':'Nights')+': '+nights:'')+'\n'; });
    });
    s+='\n'+SK.map(k=>ST[k].lbl+' = '+(L==='en'?ST[k].en:ST[k].ar)+' ('+shiftHours(k)+(L==='ar'?'س':'h')+')').join('\n');
    return s+this.foot(e);
  },
  /* short and to the point — the code carries the rest */
  swapMsg(p,me){
    const L=this.L(me), code=p.short||SwapCode.encode(p);
    const dstr=this.dateFor(me,p.d);
    const a=p.av?ST[p.av].lbl:'—', b=p.bv?ST[p.bv].lbl:'—';
    return (L==='ar'
      ? 'طلب تبديل وردية\n'+p.an+'  ⇄  '+p.bn+'\n'+dstr+'\n'+a+'  ←  '+b
        +(p.n?'\n'+p.n:'')+'\n\nالكود: '+code
      : 'Shift swap request\n'+p.an+'  <->  '+p.bn+'\n'+dstr+'\n'+a+'  ->  '+b
        +(p.n?'\n'+p.n:'')+'\n\nCode: '+code);
  },
  msgFor(e){ return this.kind==='summary'?this.summary(e):this.personal(e); },

  wa(phone,text){ const t=text||(this._last&&this._last.msg)||'';
    const p=String(phone||'').replace(/[^0-9]/g,'');
    window.open((p?'https://wa.me/'+p:'https://wa.me/')+'?text='+encodeURIComponent(t),'_blank'); },
  mail(to,subject,text){ const t=text||(this._last&&this._last.msg)||'';
    location.href='mailto:'+encodeURIComponent(to||'')+'?subject='+encodeURIComponent(subject||I18N.t('sendRoster'))
      +'&body='+encodeURIComponent(t); },
  copy(text){ const t=text||(this._last&&this._last.msg)||'';
    const done=()=>UI.toast(I18N.t('msgCopied'),'ok');
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>{});
    else { try{ document.execCommand('copy'); done(); }catch(e){} } },

  targets(){ let l=Data.engs(true);
    if(this.dept) l=l.filter(e=>e.dept===this.dept);
    const anyPick=Object.keys(this.picked).some(k=>this.picked[k]);
    if(anyPick) l=l.filter(e=>this.picked[e.id]);
    return l; },
  open(){ if(!Auth.can()) return; this.hub(); },
  draw(){
    const list=this.targets(), all=Data.engs(true);

        +'<button style="flex:1" class="'+(this.channel==='mail'?'on':'')+'" onclick="Send.channel=\'mail\';Send.draw()">'+svg('mail',13)+' '+esc(I18N.t('emailCh'))+'</button></div></div>'
      +'<div class="fld"><label>'+esc(I18N.t('msgType'))+'</label><div class="seg" style="width:100%">'
        +'<button style="flex:1" class="'+(this.kind==='personal'?'on':'')+'" onclick="Send.kind=\'personal\';Send.draw()">'+esc(I18N.t('msgPersonal'))+'</button>'
        +'<button style="flex:1" class="'+(this.kind==='summary'?'on':'')+'" onclick="Send.kind=\'summary\';Send.draw()">'+esc(I18N.t('msgSummary'))+'</button></div></div></div>'
      +'<div class="fld"><label>'+esc(I18N.t('recipients'))+' — '+okN+' / '+list.length+'</label>'
      +'<select onchange="Send.dept=this.value;Send.picked={};Send.draw()" style="margin-bottom:9px">'
        +'<option value="">'+esc(I18N.t('allEngineers'))+' ('+all.length+')</option>'
        +Data.state.depts.map(d=>'<option value="'+esc(d)+'"'+(this.dept===d?' selected':'')+'>'+esc(I18N.dept(d))+' ('+all.filter(e=>e.dept===d).length+')</option>').join('')
      +'</select>'
      +'<div style="max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:12px">'
      + (this.dept?all.filter(e=>e.dept===this.dept):all).map(e=>{
          const r=reach(e);
          return '<div class="ml-row"><span class="av">'+esc(initials(e.name))+'</span>'
            +'<span class="info"><b>'+esc(e.name)+'</b><span>'+esc(I18N.dept(e.dept))
            +' · '+(this.channel==='wa'?(e.phone?'<span dir="ltr">'+esc(e.phone)+'</span>':'<b style="color:var(--warn)">'+esc(I18N.t('noPhone'))+'</b>')
                                       :(e.email?'<span dir="ltr">'+esc(e.email)+'</span>':'<b style="color:var(--warn)">'+esc(I18N.t('noEmail'))+'</b>'))
            +'</span></span>'
            +'<button class="tbtn" onclick="Send.preview(\''+e.id+'\')">'+svg('info',13)+'</button>'
            +'<button class="tbtn primary" '+(r?'':'disabled')+' onclick="Send.one(\''+e.id+'\')">'+svg('send',13)+esc(I18N.t('sendOne'))+'</button></div>'; }).join('')
      +'</div></div>'
      +'<div class="note w">'+svg('warn')+'<div>'+esc(I18N.t('sendPopupHint'))+'</div></div>';
    UI.modal({title:I18N.t('sendRoster'),icon:'send',wide:true,body,
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('close'))+'</button>'
        +'<button class="btn btn-p" '+(okN?'':'disabled')+' onclick="Send.bulk()">'+svg('send',14)+esc(I18N.t('sendAll'))+' ('+okN+')</button>'});
  },
  preview(id){
    const e=Data.eng(id); const msg=this.msgFor(e); this._last={msg};
    UI.modal({title:I18N.t('preview')+' — '+e.name,icon:'send',wide:true,
      body:'<div class="fld"><label>'+esc(I18N.t('prefLang'))+': '+(e.lang==='en'?'English':'العربية')+'</label>'
        +'<textarea readonly rows="15" style="line-height:1.75" dir="'+(e.lang==='en'?'ltr':'rtl')+'">'+esc(msg)+'</textarea></div>',
      footer:'<button class="btn btn-g" onclick="Send.draw()">'+esc(I18N.t('back'))+'</button>'
        +'<button class="btn btn-g" onclick="Send.copy()">'+svg('copy',14)+esc(I18N.t('copyMsg'))+'</button>'
        +'<button class="btn btn-p" onclick="Send.one(\''+id+'\')">'+svg('send',14)+esc(I18N.t('sendOne'))+'</button>'});
  },
  one(id){
    const e=Data.eng(id); if(!e) return;
    const msg=this.msgFor(e); this._last={msg};
    if(this.channel==='wa'){ if(!e.phone){ UI.toast(I18N.t('noPhone'),'warn'); return; } this.wa(e.phone,msg); }
    else { if(!e.email){ UI.toast(I18N.t('noEmail'),'warn'); return; } this.mail(e.email,this.S(e,'title'),msg); }
    Data.state.history.push({id:uid('h'),ts:Date.now(),type:'send',eng:e.id,note:this.channel+'/'+this.kind});
    Data.save();
  },
  bulk(){
    const list=this.targets().filter(e=>this.channel==='wa'?e.phone:e.email);
    if(!list.length){ UI.toast(I18N.t('noData'),'warn'); return; }
    UI.confirm(I18N.t('sendAll')+' — '+list.length+' ('+I18N.t(this.channel==='wa'?'whatsapp':'emailCh')+')',()=>{
      list.forEach((e,i)=>setTimeout(()=>this.one(e.id), i*900));
      UI.closeModal(); UI.toast(I18N.t('opened',{n:list.length}),'ok');
    });
  }
};


/* =====================================================================
   COMMITTEE MANAGEMENT  —  owner (م. أحمد رزيق) only
   PINs are stored one-way hashed; the clear PIN is never persisted.

const Committee = {
  render(){

    let h='<div class="panel"><div class="panel-hd"><div class="ic">'+svg('team')+'</div>'
      +'<h3>'+esc(I18N.t('committeeMgmt'))+'</h3><span class="tag info">'+list.filter(c=>c.active!==false).length+'</span>'

        +'<div class="mem-nm">'+esc(I18N.lang==='en'?(c.nameEn||c.name):c.name)+'</div>'
        +'<div class="mem-sub">'+esc(I18N.t('rosterName'))+': <b>'+esc(c.roster||'—')+'</b></div>'
        +'<div class="mem-pin">'+svg('key',12)+'<span>•••••••</span></div>'
        +(c.phone?'<div class="mem-sub" style="margin-top:5px;direction:ltr;text-align:start">'+svg('wa',11)+' '+esc(c.phone)+'</div>'
                 :'<div class="mem-sub" style="margin-top:5px;color:var(--warn)">'+svg('warn',11)+' '+esc(I18N.t('noPhone'))+'</div>');
      if(own) h+='<div class="mem-act">'
        +'<button class="tbtn" onclick="Committee.form(\''+c.id+'\')">'+svg('pencil',13)+esc(I18N.t('edit'))+'</button>'
        +(c.owner?'':'<button class="tbtn" onclick="Committee.toggle(\''+c.id+'\')">'+esc(I18N.t(inact?'activate':'deactivate'))+'</button>'
          +'<button class="tbtn danger" onclick="Committee.del(\''+c.id+'\')">'+svg('trash',13)+'</button>')
        +'</div>';
      h+='</div>';
    });
    h+='</div></div></div>';

  },
  form(id){
    if(!Auth.canManage()) return;
    const c=id?Auth.list().find(x=>x.id===id):{id:'',name:'',nameEn:'',roster:'',role:'member',active:true};
    UI.modal({title:I18N.t(id?'editMember':'addMember'),icon:'team',
      body:(c.owner?'<div class="note i">'+svg('crown')+'<div>'+esc(I18N.t('owner'))+' — '+esc(I18N.t('cannotRemoveOwner'))+'</div></div>':'')
        +'<div class="fld"><label>'+esc(I18N.t('memberName'))+' *</label><input id="cmN" value="'+esc(c.name)+'" placeholder="م. ..."></div>'
        +'<div class="grid2"><div class="fld"><label>'+esc(I18N.t('memberPhone'))+'</label>'
        +'<input id="cmPh" dir="ltr" inputmode="numeric" value="'+esc(c.phone||'')+'" placeholder="201001234567">'
        +'<div class="hint">'+esc(I18N.t('memberPhoneHint'))+'</div></div>'
        +'<div class="fld"><label>'+esc(I18N.t('email'))+'</label><input id="cmEm" dir="ltr" type="email" value="'+esc(c.email||'')+'"></div></div>'
        +'<div class="grid2"><div class="fld"><label>'+esc(I18N.t('memberNameEn'))+'</label><input id="cmNe" dir="ltr" value="'+esc(c.nameEn||'')+'"></div>'
        +'<div class="fld"><label>'+esc(I18N.t('rosterName'))+'</label>'

        +'<input id="cmP" type="text" inputmode="numeric" dir="ltr" maxlength="12" autocomplete="off" placeholder="••••••" '
        +'style="letter-spacing:6px;font-size:17px;font-weight:800;text-align:center">'
        +'<div class="hint">'+esc(I18N.t('pinRule'))+(id?' — '+esc(I18N.t('pinKept')):'')+'</div></div>'
        +(c.owner?'':'<div class="fld"><label>'+esc(I18N.t('role'))+'</label><select id="cmRole">'
          +'<option value="member"'+(c.role!=='admin'?' selected':'')+'>'+esc(I18N.t('memberRole'))+'</option>'
          +'<option value="admin"'+(c.role==='admin'?' selected':'')+'>'+esc(I18N.t('adminRole'))+'</option></select></div>'),
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('cancel'))+'</button>'
        +'<button class="btn btn-p" onclick="Committee.save(\''+(id||'')+'\')">'+svg('save',14)+esc(I18N.t('save'))+'</button>'});
  },
  save(id){
    if(!Auth.canManage()) return;
    const nm=$('#cmN').value.trim();
    if(!nm){ $('#cmN').focus(); return; }
    const pin=($('#cmP').value||'').replace(/[^0-9]/g,'');
    if(!id && (pin.length<4||pin.length>12)){ UI.toast(I18N.t('pinRule'),'warn'); $('#cmP').focus(); return; }
    if(pin && (pin.length<4||pin.length>12)){ UI.toast(I18N.t('pinRule'),'warn'); return; }
    const h=pin?pinHash(pin):null;
    if(h && Auth.list().some(c=>c.h===h && c.id!==id)){ UI.toast(I18N.t('pinTaken'),'err'); return; }
    Data.snap('committee');
    const roleSel=$('#cmRole');
    if(id){
      const c=Auth.list().find(x=>x.id===id);
      c.name=nm; c.nameEn=$('#cmNe').value.trim(); c.roster=$('#cmR').value.trim();
      c.phone=($('#cmPh')?$('#cmPh').value.trim().replace(/[^0-9]/g,''):'');
      c.email=($('#cmEm')?$('#cmEm').value.trim():'');
      if(h) c.h=h;
      if(!c.owner && roleSel) c.role=roleSel.value;
      Data.state.history.push({id:uid('h'),ts:Date.now(),type:'committee-edit',note:nm+(h?' · PIN':'')});
      UI.toast(I18N.t(h?'pinChanged':'saved'),'ok');
    } else {
      Data.state.committee.push({id:uid('cm'),name:nm,nameEn:$('#cmNe').value.trim(),
        roster:$('#cmR').value.trim(),
        phone:($('#cmPh')?$('#cmPh').value.trim().replace(/[^0-9]/g,''):''),
        email:($('#cmEm')?$('#cmEm').value.trim():''),
        h,role:roleSel?roleSel.value:'member',active:true,added:Date.now()});
      Data.state.history.push({id:uid('h'),ts:Date.now(),type:'committee-add',note:nm});
      UI.toast(I18N.t('memberAdded'),'ok');
    }
    Data.saveNow(); UI.closeModal(); UI.refreshAll();
  },
  toggle(id){
    if(!Auth.canManage()) return;
    const c=Auth.list().find(x=>x.id===id);
    if(!c||c.owner){ UI.toast(I18N.t('cannotRemoveOwner'),'err'); return; }
    Data.snap('committee'); c.active=c.active===false;
    if(!c.active && Auth.user===id) Auth.logout();
    Data.saveNow(); UI.refreshAll(); UI.toast(I18N.t('updated'),'ok');
  },
  del(id){
    if(!Auth.canManage()) return;
    const c=Auth.list().find(x=>x.id===id);
    if(!c||c.owner){ UI.toast(I18N.t('cannotRemoveOwner'),'err'); return; }
    UI.confirm(I18N.t('del')+' — '+c.name+'؟',()=>{
      Data.snap('committee');
      Data.state.committee=Data.state.committee.filter(x=>x.id!==id);
      Data.state.history.push({id:uid('h'),ts:Date.now(),type:'committee-del',note:c.name});
      if(Auth.user===id) Auth.logout();
      Data.saveNow(); UI.refreshAll(); UI.toast(I18N.t('deleted'),'ok');
    });
  }
};


/* =====================================================================
   GATE BACKGROUND  —  the owner can replace the sign-in photograph
   The image is downscaled and re-encoded in the browser before it is
   stored, so the app stays small and localStorage never overflows.
   ===================================================================== */
const GateBG = {
  MAXW:1760, MAXBYTES:1500000,

  current(){ return (Data.state && Data.state.gateBg) || HQ_PHOTO; },
  isCustom(){ return !!(Data.state && Data.state.gateBg); },
  dark(){ const v=Data.state&&Data.state.gateDark; return v===undefined?70:+v; },
  pos(){ const v=Data.state&&Data.state.gatePos; return v===undefined?42:+v; },

  apply(){
    const r=document.documentElement.style;
    r.setProperty('--gate-dark',(this.dark()/100).toFixed(2));
    r.setProperty('--gate-pos',this.pos()+'%');
    const img=document.querySelector('.gate-photo');
    if(img) img.src=this.current();
  },

  /* --- downscale + re-encode in a canvas --- */
  process(file,cb){
    if(!/^image\//.test(file.type)){ UI.toast(I18N.t('bgNotImage'),'err'); return; }
    const rd=new FileReader();
    rd.onerror=()=>UI.toast(I18N.t('bgReadFail'),'err');
    rd.onload=e=>{
      const im=new Image();
      im.onerror=()=>UI.toast(I18N.t('bgReadFail'),'err');
      im.onload=()=>{
        try{
          const scale=Math.min(1,this.MAXW/im.width);
          const w=Math.max(1,Math.round(im.width*scale)), h=Math.max(1,Math.round(im.height*scale));
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          const cx=cv.getContext('2d');
          cx.imageSmoothingQuality='high';
          cx.drawImage(im,0,0,w,h);
          let q=0.74, out=cv.toDataURL('image/jpeg',q);
          while(out.length>this.MAXBYTES && q>0.4){ q-=0.08; out=cv.toDataURL('image/jpeg',q); }
          if(out.length>this.MAXBYTES){
            const cv2=document.createElement('canvas');
            cv2.width=Math.round(w*0.75); cv2.height=Math.round(h*0.75);
            cv2.getContext('2d').drawImage(im,0,0,cv2.width,cv2.height);
            out=cv2.toDataURL('image/jpeg',0.6);
          }
          cb(out,{w,h,kb:Math.round(out.length/1365)});
        }catch(err){ UI.toast(I18N.t('bgReadFail')+': '+err.message,'err'); }
      };
      im.src=e.target.result;
    };
    rd.readAsDataURL(file);
  },

  pick(){
    if(!Auth.canManage()) return;
    const i=document.createElement('input');
    i.type='file'; i.accept='image/*';
    i.onchange=()=>{ const f=i.files&&i.files[0]; if(!f) return;
      UI.toast(I18N.t('bgWorking'),'ok');
      this.process(f,(uri,info)=>this.save(uri,info)); };
    i.click();
  },

  save(uri,info){
    if(!Auth.canManage()) return;
    if(!uri || uri.length>this.MAXBYTES){ UI.toast(I18N.t('bgTooBig'),'err'); return; }
    const prev=Data.state.gateBg;
    Data.state.gateBg=uri;
    try{
      Data.saveNow();
      const raw=localStorage.getItem(Data.KEY);
      if(!raw || raw.indexOf('gateBg')<0) throw new Error('not stored');
      Data.state.history.push({id:uid('h'),ts:Date.now(),type:'gate-bg',note:(info?info.w+'×'+info.h+' · '+info.kb+'KB':'custom')});
      Data.saveNow();
      this.apply(); this.dialog();
      UI.toast(I18N.t('bgSaved')+(info?' · '+info.kb+' KB':''),'ok');
    }catch(err){
      Data.state.gateBg=prev; Data.saveNow();
      UI.toast(I18N.t('bgTooBig'),'err');
    }
  },

  reset(){
    if(!Auth.canManage()) return;
    delete Data.state.gateBg; Data.saveNow(); this.apply(); this.dialog();

  },
  setDark(v){ if(!Auth.canManage()) return;
    Data.state.gateDark=Math.max(20,Math.min(95,+v||70)); Data.save(); this.apply(); this.livePreview(); },
  setPos(v){ if(!Auth.canManage()) return;
    Data.state.gatePos=Math.max(0,Math.min(100,+v||42)); Data.save(); this.apply(); this.livePreview(); },

  livePreview(){

    const v=$('#bgVeil'); if(v) v.style.opacity=(this.dark()/100).toFixed(2);
    const dv=$('#bgDarkVal'); if(dv) dv.textContent=this.dark()+'%';

  },

  dialog(){

    UI.modal({title:I18N.t('gateBg'),icon:'image',wide:true,

        +'<div class="bg-prev" id="bgPrev" style="background-image:url(\''+this.current()+'\');background-position:center '+this.pos()+'%">'
          +'<div class="bg-veil" id="bgVeil" style="opacity:'+(this.dark()/100).toFixed(2)+'"></div>'
          +'<div class="bg-card"><img src="'+LOGO+'" alt=""><b class="gtext">'+esc(I18N.t('title'))+'</b>'
          +'<span>'+esc(I18N.t('whoAreYou'))+'</span></div>'

        +'</div>'
        +'<div class="grid2" style="margin-top:16px">'
        +'<div class="fld"><label>'+esc(I18N.t('bgDark'))+' — <b id="bgDarkVal">'+this.dark()+'%</b></label>'
          +'<input type="range" min="20" max="95" step="1" value="'+this.dark()+'" oninput="GateBG.setDark(this.value)"></div>'
        +'<div class="fld"><label>'+esc(I18N.t('bgPos'))+' — <b id="bgPosVal">'+this.pos()+'%</b></label>'
          +'<input type="range" min="0" max="100" step="1" value="'+this.pos()+'" oninput="GateBG.setPos(this.value)"></div>'
        +'</div>'
        +'<div class="note w">'+svg('warn')+'<div>'+esc(I18N.t('bgSizeNote'))+'</div></div>',
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('close'))+'</button>'
        +(this.isCustom()?'<button class="btn btn-g" onclick="GateBG.reset()">'+svg('history',14)+esc(I18N.t('bgReset'))+'</button>':'')
        +'<button class="btn btn-p" onclick="GateBG.pick()">'+svg('image',14)+esc(I18N.t('bgUpload'))+'</button>'});

      +'</div><div class="panel-bd">'

      +'<div class="bg-prev sm" style="background-image:url(\''+this.current()+'\');background-position:center '+this.pos()+'%">'
        +'<div class="bg-veil" style="opacity:'+(this.dark()/100).toFixed(2)+'"></div>'
        +'<div class="bg-card"><img src="'+LOGO+'" alt=""><b class="gtext">'+esc(I18N.t('title'))+'</b></div></div>'

/* =====================================================================
   NIGHT-SHIFT REMINDERS  —  via the phone's own calendar (.ics)
   ---------------------------------------------------------------------
   A static web page cannot fire a scheduled notification while it is
   closed — that needs a push server. What DOES work everywhere, offline
   and for free, is handing the phone a calendar file: the built-in
   Calendar app then raises the alarm itself, even if this app is never
   opened again.
   ===================================================================== */
const ICS = {
  esc(t){ return String(t==null?'':t)
    .replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); },
  fold(l){ /* RFC5545: keep lines short; split on character boundaries */
    if(l.length<=70) return l;
    let out='', i=0;
    while(i<l.length){ const n=(i===0?70:69); out+=(i?'\r\n ':'')+l.slice(i,i+n); i+=n; }
    return out;
  },
  stamp(d){ const p=n=>String(n).padStart(2,'0');
    return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+'00Z'; },
  local(dateStr,hhmm){ const p=n=>String(n).padStart(2,'0');
    const d=parseISO(dateStr), [H,M]=String(hhmm||'16:00').split(':').map(Number);
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(H||0)+p(M||0)+'00'; },
  plus(dateStr,hhmm,hours){ const p=n=>String(n).padStart(2,'0');
    const d=parseISO(dateStr), [H,M]=String(hhmm||'16:00').split(':').map(Number);
    d.setHours(H||0,M||0,0,0); d.setMinutes(d.getMinutes()+Math.round((hours||16)*60));
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'; },

  nightStart(){ return (Data.state.settings.nightStart)||'16:00'; },
  lead(){ return Math.max(0,Math.min(168, +Data.state.settings.leadHours||24)); },

  /* every ل shift of one engineer in the current cycle */
  eventsFor(eng){
    const out=[], A=Data.A(), m=A[eng.id]||{};
    Data.dates().forEach(d=>{ if(m[d]==='L') out.push(d); });
    return out;
  },

  build(engs,opts){
    opts=opts||{};
    const now=this.stamp(new Date()), st=this.nightStart(), dur=shiftHours('L')||16;
    const lead=this.lead();
    const L=[];
    L.push('BEGIN:VCALENDAR','VERSION:2.0','CALSCALE:GREGORIAN','METHOD:PUBLISH',
           'PRODID:-//WE Middle Delta//Unified Shift Roster//AR',
           this.fold('X-WR-CALNAME:'+this.esc(I18N.t('nightCalName')+' — '+Data.cycleName())),
           'X-WR-TIMEZONE:Africa/Cairo');
    let n=0;
    engs.forEach(e=>{
      this.eventsFor(e).forEach(d=>{
        n++;
        const uid='we-'+Data.state.activeCycle+'-'+e.id+'-'+d+'@middledelta.we';
        const nm=(e.lang==='en'?'Eng. ':'م. ')+e.name;
        const title=(e.lang==='en'?'Night shift (ل) — ':'وردية ليلية (ل) — ')+e.name;
        const desc=(e.lang==='en'
          ? 'Unified Shift Roster – Middle Delta Engineers\\nEngineer: '+nm+'\\nShift: ل — Night ('+dur+'h)\\nDept.: '+(DEPT_EN[e.dept]||e.dept)
          : 'الوردية الموحدة لمهندسين وسط الدلتا\\nالمهندس: '+nm+'\\nالوردية: ل — ليلية ('+dur+' ساعة)\\nالإدارة: '+e.dept)
          +'\\n\\nWE Unified Shift Management System\\nPowered By Eng. Ahmed Rozaiq';
        L.push('BEGIN:VEVENT',
          'UID:'+uid,'DTSTAMP:'+now,
          'DTSTART:'+this.local(d,st),
          'DTEND:'+this.plus(d,st,dur),
          this.fold('SUMMARY:'+this.esc(title)),
          this.fold('DESCRIPTION:'+desc),
          'CATEGORIES:WE,NIGHT-SHIFT',
          'STATUS:CONFIRMED','TRANSP:OPAQUE','SEQUENCE:0',
          /* main reminder */
          'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT'+lead+'H',
          this.fold('DESCRIPTION:'+this.esc(I18N.t('nightAlarm'))), 'END:VALARM',
          /* short reminder just before the shift */
          'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-PT2H',
          this.fold('DESCRIPTION:'+this.esc(I18N.t('nightAlarm2'))), 'END:VALARM',
          'END:VEVENT');
      });
    });
    L.push('END:VCALENDAR');
    return {text:L.join('\r\n'), count:n};
  },

  download(engs,name){
    const r=this.build(engs);
    if(!r.count){ UI.toast(I18N.t('noNightShifts'),'warn'); return 0; }
    /* the BOM keeps Arabic readable in every calendar app */
    /* name the file after the engineer when it is a single person */
    const auto = (engs.length===1 && engs[0] && engs[0].name)
      ? 'WE-Night-'+String(engs[0].name).trim().replace(/\s+/g,'-')
      : 'WE-Night-Shifts';
    IO.download(new Blob(['\ufeff'+r.text],{type:'text/calendar;charset=utf-8'}),
      (name||auto)+'-'+Data.cycle().start+'.ics');
    Data.state.history.push({id:uid('h'),ts:Date.now(),type:'calendar',note:(name||'')+' · '+r.count});
    Data.save();
    UI.toast(I18N.t('icsReady',{n:r.count}),'ok');
    return r.count;
  },

  mine(){ const e=Auth.meEng()||Data.eng(Data.state.selectedEng); if(!e) return;
    this.download([e],'WE-Night-'+e.name.replace(/\s+/g,'-')); },

  dialog(){
    const engs=Data.engs(true);
    const rows=engs.map(e=>{ const n=this.eventsFor(e).length;
      return {e,n}; }).filter(r=>r.n>0);
    const total=rows.reduce((a,r)=>a+r.n,0);
    UI.modal({title:I18N.t('nightReminderCal'),icon:'cal',wide:true,
      body:'<div class="note s">'+svg('check')+'<div>'+esc(I18N.t('icsHow'))+'</div></div>'
        +'<div class="note w">'+svg('warn')+'<div>'+esc(I18N.t('icsWhyNotPush'))+'</div></div>'
        +'<div class="grid2">'
        +'<div class="fld"><label>'+esc(I18N.t('nightStartHour'))+'</label>'
          +'<input type="time" value="'+esc(this.nightStart())+'" onchange="Data.state.settings.nightStart=this.value;Data.save();ICS.dialog()">'
          +'<div class="hint">'+esc(I18N.t('nightStartHint',{h:shiftHours('L')}))+'</div></div>'
        +'<div class="fld"><label>'+esc(I18N.t('reminderLead'))+'</label>'
          +'<input type="number" min="1" max="168" value="'+this.lead()+'" onchange="Data.state.settings.leadHours=+this.value||24;Data.save();ICS.dialog()">'
          +'<div class="hint">'+esc(I18N.t('icsTwoAlarms',{n:this.lead()}))+'</div></div></div>'
        +'<div class="sect-t">'+esc(I18N.t('engineers'))+' — '+total+' '+esc(I18N.t('nightShiftsWord'))+'</div>'
        +'<div style="max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:12px">'
        +(rows.length?rows.map(r=>'<div class="ml-row"><span class="av">'+esc(initials(r.e.name))+'</span>'
            +'<span class="info"><b>'+esc(r.e.name)+'</b><span>'+esc(I18N.dept(r.e.dept))+' · '+r.n+' × ل</span></span>'
            +'<button class="tbtn primary" onclick="ICS.download([Data.eng(\''+r.e.id+'\')],\'WE-Night-'+esc(r.e.name).replace(/\s+/g,'-')+'\')">'
            +svg('cal',13)+esc(I18N.t('icsDownload'))+'</button></div>').join('')
          :'<div class="empty-s"><p>'+esc(I18N.t('noNightShifts'))+'</p></div>')
        +'</div>',
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('close'))+'</button>'
        +(total?'<button class="btn btn-p" onclick="ICS.download(Data.engs(true),\'WE-Night-All\')">'
          +svg('cal',14)+esc(I18N.t('icsAll'))+'</button>':'')});
  }
};

  toggleFilter(k){ Data.state.filterShift[k]=Data.state.filterShift[k]?0:1; Data.save(); this.renderLegend(); Roster.render(); },
  renderCycleChip(){
    const c=Data.cycle(); if(!c) return;
    const n=daysBetween(c.start,c.end);
    $('#cycName').textContent=Data.cycleName(c);
    $('#cycRange').textContent=fmtShort(c.start)+' → '+fmtShort(c.end);
    const b=$('#cycBadge');
    b.className = n===30?'ok-pill':'warn-pill';
    b.textContent = n===30 ? '✓ 30' : '⚠ '+n;
    b.title = n===30 ? I18N.t('cycleOk') : I18N.t('cycleWarnMsg',{n});
    if(typeof Auth!=='undefined' && !Auth.isAdmin()){ const wb=$('#warnBtn'); if(wb) wb.style.display='none';
      $('#cycName').textContent=Data.cycleName(); $('#cycRange').textContent=fmtShort(Data.cycle().start)+' → '+fmtShort(Data.cycle().end);
      const b0=$('#cycBadge'); if(b0){ const n0=daysBetween(Data.cycle().start,Data.cycle().end);
        b0.className=n0===30?'ok-pill':'warn-pill'; b0.textContent=n0===30?'✓ 30':('⚠ '+n0); } return; }
    const wb2=$('#warnBtn'); if(wb2) wb2.style.display='';
    const all=Data.warnings(); const w=all.filter(x=>x.lvl!=='info').length;
    const dup=all.some(x=>x.k==='wDupName'||x.k==='wLikelyDup');
    $('#warnCount').textContent=w;
    $('#warnBtn').style.color = dup ? '#FF9BB4' : (w? '#FFC7A0':'');
    $('#warnBtn').style.background = dup ? 'rgba(230,0,126,.4)' : '';
    $('#warnBtn').title = dup ? I18N.t('dupFound') : I18N.t('warnings');
  },
  renderDeptFilter(){
    const sel=$('#rDept'); const cur=sel.value;
    sel.innerHTML='<option value="">'+esc(I18N.t('allDepts'))+'</option>'
      +Data.state.depts.map(d=>'<option value="'+esc(d)+'">'+esc(I18N.dept(d))+'</option>').join('');
    if(cur) sel.value=cur;
  },
  openCycles(){ this.go('settings'); setTimeout(()=>$('#setHost').scrollIntoView({behavior:'smooth'}),80); },
  openWarnings(){
    const w=Data.warnings();
    const grp={err:[],warn:[],info:[]}; w.forEach(x=>grp[x.lvl].push(x));
    let b='';
    if(!w.length) b='<div class="note s">'+svg('check')+'<div>'+esc(I18N.t('noWarnings'))+'</div></div>';
    ['err','warn','info'].forEach(lv=>{ if(!grp[lv].length) return;
      const cls=lv==='err'?'e':lv==='warn'?'w':'i';
      const seen={};
      b+='<div class="sect"><div class="sect-t">'+(lv==='err'?'●':lv==='warn'?'▲':'○')+' '+grp[lv].length+'</div>';
      grp[lv].slice(0,40).forEach(x=>{ const key=x.k+x.d; if(seen[key])return; seen[key]=1;
        b+='<div class="note '+cls+'" style="margin-bottom:7px;padding:9px 12px">'+svg(lv==='info'?'info':'warn')
          +'<div><b>'+esc(I18N.t(x.k))+'</b>'+(x.d?' — '+esc(x.d):'')
          +(x.eng?' <button class="tbtn" style="padding:2px 7px;font-size:10px" onclick="UI.closeModal();Engineers.edit(\''+x.eng+'\')">'+esc(I18N.t('edit'))+'</button>':'')
          +(x.dup?' <button class="tbtn primary" style="padding:2px 8px;font-size:10px" onclick="UI.closeModal();UI.go(\'engineers\')">'+esc(I18N.t('merge'))+'</button>':'')
          +'</div></div>'; });
      b+='</div>';
    });
    b+='<div class="note i">'+svg('info')+'<div>'+esc(I18N.lang==='ar'
        ?'التحذيرات للعلم فقط — النظام لا يغيّر أي وردية تلقائيًا. القرار النهائي دائمًا للمسؤول.'
        :'Warnings are informational only — the system never changes a shift automatically. You always decide.')+'</div></div>';
    this.modal({title:I18N.t('warnings'),icon:'warn',wide:true,body:b,
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('close'))+'</button>'});
  },
  modal(o){
    $('#modalHost').innerHTML='<div class="modal'+(o.wide?' wide':'')+'" onclick="event.stopPropagation()">'
      +'<div class="m-hd"><div class="ic">'+svg(o.icon||'info')+'</div><div style="flex:1"><h3>'+esc(o.title)+'</h3>'
      +(o.subtitle?'<p>'+esc(o.subtitle)+'</p>':'')+'</div>'
      +'<button class="m-x" onclick="UI.closeModal()">'+svg('x',15)+'</button></div>'
      +'<div class="m-bd">'+o.body+'</div>'
      +(o.footer?'<div class="m-ft">'+o.footer+'</div>':'')+'</div>';
    $('#ovl').classList.add('on');
    const f=$('#ovl').querySelector('input,select,textarea'); if(f&&f.autofocus!==false) setTimeout(()=>f.focus(),60);
  },
  closeModal(){ $('#ovl').classList.remove('on'); $('#modalHost').innerHTML=''; },
  confirm(msg,cb){ this._cb=cb;
    this.modal({title:I18N.t('confirm'),icon:'warn',
      body:'<div class="note w">'+svg('warn')+'<div style="font-size:13px">'+esc(msg)+'</div></div>',
      footer:'<button class="btn btn-g" onclick="UI.closeModal()">'+esc(I18N.t('cancel'))+'</button>'
        +'<button class="btn btn-d" onclick="var f=UI._cb;UI.closeModal();f&&f()">'+esc(I18N.t('confirm'))+'</button>'}); },
  toast(msg,kind,withUndo){
    const t=el('div','toast '+(kind||''),
      svg(kind==='ok'?'check':kind==='err'?'x':kind==='warn'?'warn':'info',16)+'<span>'+esc(msg)+'</span>'
      +(withUndo?'<button class="t-undo" onclick="UI.toastUndo(this)">'
        +svg('undo2',13)+esc(I18N.t('undo'))+'</button>':''));
    $('#toastW').appendChild(t);
    setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),260); },withUndo?5200:2600);
  },
  /* one-tap undo straight from the notification */
  toastUndo(btn){
    const t=btn&&btn.closest?btn.closest('.toast'):null;
    if(t){ t.classList.add('out'); setTimeout(()=>t.remove(),250); }
    if(!Data._undo.length){ this.toast(I18N.t('nothingUndo'),'warn'); return; }
    Data.undo();
  },
  actName(l){ const k='act_'+(l||'cell'); const v=I18N.t(k); return v===k?(l||''):v; },
  syncUndo(){
    const u=$('#undoBtn'), r=$('#redoBtn'), c=$('#undoCount');
    if(!u) return;
    const n=Data._undo.length;
    u.disabled=!n; r.disabled=!Data._redo.length;
    if(c) c.textContent=n>99?'99+':String(n);
    u.title = n ? (I18N.t('undoLast')+': '+this.actName(Data._undo[n-1].label)+'  ·  '+I18N.t('undoSteps',{n})+'  ·  Ctrl+Z')
                : I18N.t('nothingUndo');
    r.title = Data._redo.length ? (I18N.t('redoLast')+'  ·  Ctrl+Y') : I18N.t('redoLast');
  },
  applyTheme(){ const d=Data.state.theme==='dark';
    document.documentElement.dataset.theme=d?'dark':'light';
    $('#themeIco').innerHTML=svg(d?'sun':'moon',15); },
  toggleTheme(){ Data.state.theme=Data.state.theme==='dark'?'light':'dark'; Data.save(); this.applyTheme();
    if(Data.state.view==='settings') Settings.render(); }
};

/* ------------------ BOOT ------------------ */
(function boot(){
 try{
  Data.load();
  Auth.load();
  I18N.lang = Data.state.lang || 'ar';
  Roster.density = Data.state.settings.density || 'normal';
  $('#logoImg').src = LOGO;
  UI.applyTheme();
  GateBG.apply();
  Roster.syncTotalsBtn();
  Roster.applyDensity();
  UI.renderDeptFilter();
  UI.buildNav(); UI.renderLegend(); UI.renderCycleChip();
  I18N.apply();
  UI.applyRole();
  UI.go(Data.state.view||'roster');
  UI.syncUndo();
  /* never restore an open statistics panel for engineers */
  if(!Auth.isAdmin()) { Data.state.selectedEng=null; Side.close(); }
  else if(Data.state.selectedEng) Side.open(Data.state.selectedEng,true);
  if(!Auth.role) Auth.gate('role');
  // fit on first load for wide screens
  setTimeout(()=>{ try{ if(innerWidth>1100 && !localStorage.getItem('we_fit_once')){ localStorage.setItem('we_fit_once','1'); Roster.fit(); } }catch(e){} },250);
  let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(Roster.fitOn){Roster.fitOn=false;Roster.fit();} else Roster.render(); },220); });
  addEventListener('beforeunload',()=>Data.saveNow());
  window.WE={Data,Roster,UI,I18N,IO,Side,Swap,Pop,Notify,Stats,Engineers,Cycles,History,Settings,Chart,T,SEED,normName,initials,deptColor,Publish,Requests,SwapCode,Auth,EngMode,Send,gateScene,GateBG,HQ_PHOTO,ICS,COMMITTEE_SEED,COMMITTEE_LIST,Committee,pinHash,
    SHIFT_TYPES,SK,ST,DUTY_K,LEAVE_K,shiftHours,shiftName,shiftFull,DEF_HOURS};
  const _d=Data.findDups();
  if(_d.length){ const ex=_d.some(g=>g.exact);
    setTimeout(()=>{ UI.toast(I18N.t(ex?'dupFound':'dupLikely')+': '+_d.map(g=>g.list.map(e=>e.name).join(' ⟷ ')).join(' | '), ex?'err':'warn'); },700);
    console.warn('Duplicate / similar engineer names (NOT auto-merged):',_d.map(g=>({exact:g.exact,names:g.list.map(e=>e.name+'#'+e.id)}))); }
  console.log('%cWE Unified Shift Roster','color:#5B2C94;font-weight:800;font-size:14px',
    '| engineers:',Data.state.engineers.length,'| cycle:',Data.cycle().start,'→',Data.cycle().end,'|',Data.dates().length,'days');
 }catch(err){
  console.error(err);
  if(window.__weBoom) window.__weBoom(err.message,(err.stack||'').split('\n')[1]||'');
 }
})();
</script>
</body>
